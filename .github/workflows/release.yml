name: Release
# 两条独立的发布动作，故意**不**串在一起：
#   1) GitHub Release（打 tag 即触发，自动）：确定性发布归档 + SHA256SUMS.txt，
#      两者各带一份 GPG detached 签名。归档 = 被 tag 的那棵树 + updater 自己在目标机上产不出的
#      JS 构建产物（`mcp-shell/dist`、`mcp-shell/schemas`）——纯源码归档会让 `npm pack` 打出一个
#      没有可执行文件的包，2026-10-01 真机因此每次换版都回滚。install.sh / npx 钉的就是这个 tag，
#      用户据此可复现同一份内容；签名是 updater 第 8 道校验（作者性）的判据，签不出来就不发这一版。
#   2) npm publish（手动 workflow_dispatch，默认 dry）：两个裸名包带 provenance。
#      不挂在 tag 事件上，因为"发了 tag"不等于"决定对外发版"——发布不可逆，
#      必须是一次显式操作。
#
# 前置已于 2026-09-22 满足：两个包（glasspane-mcp / glasspane-install）在
# npmjs.com 各配了一条 GitHub Actions Trusted Publisher，仓库
# jingzhao-l/GlassPane、工作流 release.yml、环境 release。发布授权留在人手里靠的是
# **触发本身**：npm 这条只认 workflow_dispatch 且 mode=publish，打 tag 不会发版
# （GitHub Release 与 npm publish 是两条独立动作，见文件开头）。
#   · 2026-09-29 发 1.4.0 实测：trusted publisher **直发成功**，provenance 进了 sigstore
#     透明日志，没有产生任何 stage 件。这里此前写的「"publish directly" 未勾
#     （staged only）」已不成立 —— 别按那句话去终端找 `npm stage approve`。
#   · 万一哪天直发被拒（TP 配置改回 staged-only，或 npm 对 bypass-2FA token 的策略
#     收紧），下面那条分支接住：把包 stage 起来，**然后判红**——这一跑没把任何东西放上
#     registry，让它绿就是 v0.7.6 那种"job 绿、registry 查无此版"的事故。owner 用
#     `npm stage approve <stage-id>`（2FA）兑现存在，再重跑这一版。
# npm CLI ≥ 11.15 才有 stage 子命令，故先全局升一条钉死版本的 npm（不是 `npm@11` 那种飘的
# dist-tag，理由见下面那条步骤的注释）；不配 NPM_TOKEN
# （空 token 会被 setup-node 写进 .npmrc，反而挡住 OIDC）。
# npm 11 行为变化：`npm publish --dry-run` 不再纯本地、会查 registry 撞已发
# 版本，所以 dry 分支一律用 `npm pack --dry-run`。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: "publish 前先只做打包校验？"
        type: choice
        required: true
        default: dry
        options:
          - dry
          - publish

permissions:
  contents: read

jobs:
  github-release:
    name: release archive (source + built JavaScript) + SHA256SUMS
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # D5（2026-10-24 复核：这条 lane 原来一条 `timeout-minutes` 都没有，14 个 job 全在默认 6 小时上）。
    # 这里的 45 不是"实测最慢的那次"（`gh api …/jobs` 量到 22–313s）而是**判据允许的最坏一次**：
    # 第一步 `assert-ci-green` 的等待预算本身就是 1200000ms = 20 分钟，再加构建、签名、建 Release
    # 与读回。给 30 会在一棵"CI 还在跑、正在等"的正常树上把这一格咬断——那比没有 timeout 更糟。
    # 同批补的数值口径写在 ci.yml 顶部那段（实测耗时 × 5–8 倍，且不低于判据内部的等待预算）。
    timeout-minutes: 45
    # 签名私钥配在这个环境里，job 不声明它就读不到 —— v1.4.0 首跑正是因为没声明，
    # detect 步走了"没配"那条分支，于是照常发了货、只是没有 .asc。环境本身无保护规则
    # （protection_rules 为空、can_admins_bypass），所以声明它不会给打 tag 增加人工审批。
    environment: release
    permissions:
      contents: write
      # `scripts/assert-ci-green.mjs` asks GitHub which CI runs exist for this commit. The
      # `/actions/workflows/<file>/runs` endpoint needs `actions: read`, and a job-level block
      # replaces the workflow-level one — leaving it unnamed makes the question fail closed.
      actions: read
    # Pinned, and `check-workflows.mjs` now enforces that this file stays pinned: this job
    # declares `environment: release`, so it is the one place a mutable action ref has
    # something worth stealing — it reads `secrets.GPG_PRIVATE_KEY` and holds `contents: write`.
    # A retagged `@v4` would run attacker code there, sign an attacker archive with the real
    # key, and the updater's 8th gate (authorship) would accept it, because that gate checks
    # the fingerprint, not the bytes' provenance. `ci.yml`'s read-only lanes are not pinned
    # yet; they hold no secrets, so the rule is scoped to jobs that declare an environment.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: The CI of this exact commit must be green before anything ships
        # 放在最前面：这一版还没构建、没签名、没上传，拒绝在这里什么都不必回滚。判据写在
        # `scripts/assert-ci-green.mjs` 里（"没跑完就等满预算"与"没记录＝没有证据"两种出路都在那儿），
        # 这一步只负责在它说不发的时候让 job 死掉，而不是把结论打印完继续发。
        # `GH_TOKEN` 不是可选项：runner 给 step 的是 `GITHUB_TOKEN`，而 `gh` 认的是 `GH_TOKEN`——
        # v1.16.2 那次这一步就是这么死的（run 38855034310：`gh api 回了 4：… set the GH_TOKEN
        # environment variable`），下面建 Release 那一步早就带着它，正是同一件事的先例。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/assert-ci-green.mjs \
            --sha "$(git rev-parse HEAD)" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --budget 1200000 --poll 30000
      - name: Validate tag and version line
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ref 来自事件字段：先按 semver tag 形状校验，再使用（不直接插进 shell）。
          case "$REF_NAME" in
            v[0-9]*) ;;
            *) echo "::error::tag 形状不是 vX.Y.Z：$REF_NAME"; exit 1 ;;
          esac
          VERSION="${REF_NAME#v}"
          node scripts/check-version.mjs "$VERSION"
          # 后续步骤各自独立 shell：校验过的值经 GITHUB_ENV 传下去，
          # 不在下游重新读事件字段（set -u 下 v1.1.0 首跑就是栽在这）。
          {
            echo "REF_NAME=$REF_NAME"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Build the JavaScript layer the archive has to carry
        run: |
          set -euo pipefail
          # The updater installs the two npm packages by running `npm pack` **inside the unpacked release
          # tree** (§1: the verified bytes are the installed bytes). A tree without `mcp-shell/dist` therefore
          # packs a package whose declared command does not exist: measured on a real machine on 2026-10-01,
          # that tarball had three entries, `npm install -g` exited 0, the version read back fine, and §3.3's
          # MCP half died on `glasspane-mcp could not run (ENOENT)` — the whole swap rolled back. Building
          # here is what makes the archive installable at all; the next step refuses to publish if it is missing.
          npm ci --no-audit --no-fund
          # The root script is the ordered one: mcp-shell is the only TypeScript workspace left in
          # this tree (the kernel is the published `iterate-kernel`, bundled by the next step), so the
          # order is stated by `package.json` rather than guessed here.
          npm run build
          npm run bundle --workspace glasspane-mcp
      - name: Build the deterministic release archive
        run: |
          set -euo pipefail
          # This used to be `git archive HEAD`, which is pure source and cannot produce a runnable
          # `glasspane-mcp`. The recipe now lives in `scripts/make-release-archive.mjs` — the same code the
          # test suite runs — because it has to carry the two build outputs above, keep the tracked tree's
          # modes, and prove its own reproducibility by packing twice and comparing bytes. Only what this
          # repo generated goes into `SHA256SUMS-<ver>.txt`, so only what this repo can rebuild may be in it.
          node scripts/make-release-archive.mjs "$VERSION" "GlassPane-${VERSION}.tar.gz"
          sha256sum "GlassPane-${VERSION}.tar.gz" > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"
      - name: Prove the archive carries the command it promises
        run: |
          set -euo pipefail
          # The refusal inside the packing step is the publisher's guard; this one re-reads the artifact that
          # is about to be published, so a change to either side is noticed. It calls the same script rather
          # than `tar -tzf | grep -q`: `grep -q` exits at the first match, GNU tar then dies of SIGPIPE, and
          # `set -o pipefail` turns a passing check into a failing step — which is exactly how this step
          # reddened on 2026-10-01 while naming an entry the archive did contain.
          node scripts/make-release-archive.mjs --verify "GlassPane-${VERSION}.tar.gz" "$VERSION"
      - name: "Prove the identity gate can go red (self-test)"
        # 这道闸自己能不能红？它比的是「哪把 key 签的」与「产品钉死的是哪把 key」，而这两件事
        # 一旦相等就再也不分得开——所以它的绿必须是**测过红**的绿。形状与本仓其余自测同一档
        # （kernel-pin、release-artifact、verify-published）：跑真脚本、拿真一次性 key、
        # 退出码与正文各判一遍，「测不了」一律判红而不是放行。
        # 四条臂：① pin 就是签名的 key → 必须 exit 0；② 一次性 key 签、拿 shipped 锚去 pin →
        # 必须非 0 且把两枚指纹都点名（这就是缺陷本体：签名有效、key 不对）；③ 生产调用形态
        # （不传 pin，闸自己去 import updater/lib/signature.js）→ 必须非 0；④ 签完之后改一个字节 →
        # 必须非 0（闸量的是这份字节的签名，不是「目录里有一张能解析的签名」）。
        # 放在签名之前：它不需要 release 环境的 secret，也不需要已构建的产物，坏在这里时
        # 上面只花了构建的钱，而下面一步签名都还没开始。
        run: |
          set -euo pipefail
          rc=0
          out="$(bash tools/release-signing-gate.sh selftest 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::签名身份闸的自测以 exit $rc 失败（上面 FAIL 点名的是四条臂里的哪一条）。remedy：先修 tools/release-signing-gate.sh 那条被点名的判决，别放宽期望值——这条闸唯一的用途就是在 gh release create 之前挡住「签名有效但 key 不对」；它退化成套文件名字，绿的就是 v1.4.0 那个「发布绿、每台机器的自动更新死」。"
            exit 1
          fi
          case "$out" in
            *"NOT self-tested"*)
              echo "::error::签名身份闸的自测回答了「没测量」。这条 job 有 node（上面 setup-node 已装）与 ubuntu-latest 自带的 gpg，此刻拒绝建一次性 key 就是缺陷而不是环境限制。remedy：查 gpg 是否仍在这张 runner 的 PATH 上，别把判据改成 exit 0。"
              exit 1 ;;
          esac
          # 退 0 还不够：绿必须是**四条臂都跑过**的绿。只缺一条的绿说明某条判决被悄悄删掉了。
          for arm in ARM1 ARM2 ARM3 ARM4; do
            case "$out" in
              *"$arm"*) ;;
              *)
                echo "::error::签名身份闸的自测退 0 却没有报出 $arm —— 一条没人跑过的臂等于一条没有的臂。remedy：查 tools/release-signing-gate.sh 的 cmd_selftest 是不是漏了计数或提前 return。"
                exit 1 ;;
            esac
          done
          echo "签名身份闸自测已测量：四条臂各按它点名的理由回答（1 绿 / 3 红），每条红都点名真正的分歧侧"
      - name: Sign release artifacts with GPG
        # 签名是**必须成功的一步**，不是 best-effort。这一份 `.asc` 是 updater 第 8 道校验
        # （作者性）唯一的判据：没有它，每一次定时更新都会停在 needs-consent，"自动更新"这个
        # 功能对外等于没有 —— 而 v1.4.0 的首跑正是这样一个 release（签名步被静默跳过，货照样
        # 发）。宁可这一版发不出去，也不发一个下游必然拒绝自动应用的产物：这一步失败时"建
        # Release"还没执行，什么对外可见的东西都没留下。
        # 未配置或口令不对都归一为"这一步失败"；remedy 说清配在哪、用哪条命令。
        env:
          GPG_INPUT_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_INPUT_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY 读不到。签名私钥配在 release 环境，本 job 已声明该环境，" \
              "所以读不到只有两种可能：secret 没配，或被改名。配法：" \
              "printf '%s' <armored 私钥> | gh secret set GPG_PRIVATE_KEY --env release，" \
              "口令同理（--env release 而非仓库级）。修好之前不发版。"
            exit 1
          fi
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_INPUT_KEY" | gpg --batch --yes --import
          # 口令走 `--passphrase-fd 0`（stdin），不走把口令写进 argv 的那种形式：后者在同一台
          # runner 上 `ps -eww -o args` 就能被读到（本地实测：签名进行中 12 次采样全部读到），
          # 而 loopback pinentry 本来就是为"从文件描述符喂进来"设计的。
          # 两份签名件的产出判据仍是下面那两条 `[ -s ]`：gpg 退 0 不等于落盘。
          for f in "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"; do
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --armor "$f"
          done
          # 两份签名件都得存在且非空：少一份就是这一步没做完，而"做完"的证据只能来自文件系统，
          # 不能来自 gpg 的退出码（空输入、口令不对都可能是退 0 而不落盘）。
          for f in "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"; do
            [ -s "${f}.asc" ] || { echo "::error::${f}.asc 缺失或为空 —— 签名没有真的产出"; exit 1; }
          done
          ls -la *.asc
      - name: "The key that signed must be the key this product pins"
        # 上面那一步证明的是「有两份非空的 .asc」。它证明不了这两份是**谁**签的 —— 而
        # `updater/lib/signature.js` 的第 8 道校验判的恰恰是这一件事：`classifySignature` 在
        # 「import 进来的 ring 里有被钉的那把主指纹」**且**「`VALIDSIG` 报的就是它」时才算 verified，
        # 其余一律 invalid；`lib/check.js` 又把 `signature-invalid` 放在 `AUTHORSHIP_CONSENT_CODES`
        # 之外，`--consent unsigned-release` 也救不回来。所以 secret 被改名、被重新导入、或悄悄换成
        # 另一把 key 的时候，旧链子的结果是：Release 绿着发出去、签名有效、key 不对，而每台装好的机器
        # 对这个版本的自动更新都是死的，发布链路上没有任何一句话说出来过。
        # 判据的两个输入都不在这个文件里落地：
        #   · 锚：闸 `import()` `updater/lib/signature.js`，取它自己的 `PINNED_PRIMARY_FINGERPRINT`，
        #     再经它自己的 `normalizePinnedFingerprint` 归一（抄第二份指纹进 workflow 就是本仓被咬过
        #     两次的「两份必须一致而没人检查」，也正是 release-anchor 那套机制反对的事）；
        #   · 签名者：`gpg --verify --status-fd 1` 的 `[GNUPG:] VALIDSIG` 第一个字段，交给
        #     signature.js 自己的 `validSigFingerprint` 解析（不用 `--list-packets`：它只给 16 位
        #     key id 的截断值，也不判这些字节是否真被签名验过——而 runtime 比的从来就是完整指纹）。
        # 这一步失败时 `gh release create` 与 `gh release upload` 都还没执行，对外什么都没留下：
        # 宁可这一版发不出去。判红把两枚指纹与可执行 remedy 一起打出来（见脚本里的 remedy_block）。
        run: |
          set -euo pipefail
          # --gnupg-home 显式指回签名那一步用的 ring（同一条 job 的文件系统，密钥就在里面）。
          # 传空不如传实：路径写出来，日志里才看得见闸问的是哪一把 key。
          bash tools/release-signing-gate.sh check \
            --gnupg-home "${GNUPGHOME:-$HOME/.gnupg}" \
            -- "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Release ${VERSION}. Release archive checksum: see \`SHA256SUMS-${VERSION}.txt\`, which is GPG-signed — \`gpg --verify SHA256SUMS-${VERSION}.txt.asc SHA256SUMS-${VERSION}.txt\`. The archive is the tagged tree less \`harness/\` (the vendored fork no install step reads, 90% of the repository's bytes) plus the JavaScript build output the updater's npm step needs (\`mcp-shell/dist\`, \`mcp-shell/schemas\`); the Swift app is still built on the target machine."
          # 安装命令钉在 ${REF_NAME} 上，不写 main：上一句刚把 tag 说成可复现性的锚点，
          # 下一条命令却把人支到一个会移动的分支上——今天照它装到的与这个 tag 的内容
          # 对不对得上看运气。REF_NAME 由校验过形状的那一步经 GITHUB_ENV 传下来。
          NOTES="$NOTES"$'\n\n'"Install (one command, clones this tag): \`curl -fsSL https://raw.githubusercontent.com/jingzhao-l/GlassPane/${REF_NAME}/install.sh | sh\`"
          NOTES="$NOTES"$'\n\n'"See [CHANGELOG.md](https://github.com/jingzhao-l/GlassPane/blob/${REF_NAME}/CHANGELOG.md) for what changed."
          # target 显式钉在被 checkout 的 commit 上：gh 默认会写成分支名，
          # 那样 Release 的 target 就与 tag 内容脱钩，可复现性锚点只剩资产本身。
          TARGET_SHA=$(git rev-parse HEAD)
          # 四件一起传，签名件按名字点名：上一步已经保证两份 .asc 都存在且非空，所以这里
          # 不再"存在才带上"（那种形状正是把静默降级写进发布路径）。
          ASSETS=()
          for f in "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"; do
            ASSETS+=("$f" "${f}.asc")
          done
          # 用默认 GITHUB_TOKEN 建的 Release 会落为 draft（GitHub 对 Actions
          # 身份建的发布默认不直接对外），不显式取消就永远只挂在 /releases 草稿区。
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$REF_NAME" --notes "$NOTES" --target "$TARGET_SHA"
          else
            gh release create "$REF_NAME" \
              "${ASSETS[@]}" \
              --title "GlassPane ${VERSION}" --notes "$NOTES" --target "$TARGET_SHA"
          fi
          gh release edit "$REF_NAME" --draft=false --latest
          # 读回来判，不是读回来打印。`gh release edit` 退 0 不是"这一版已经对外"的证据：GitHub 会
          # 把 Actions 身份建的发布留在草稿态，而留在草稿态时 /releases/latest 继续服务**上一个 tag**
          # ——`updater/lib/check.js` 把"最新已发布的版本比本机跑的还旧"判成 `up-to-date` + exit 0，
          # 于是这一格绿着让每台机器安静地不再更新（同一形状的先例见本文件开头 v1.4.0 那条签名事故，
          # 也见 harness/glasspane-harness 的 publish-release 步：那里 `[ "$state" != "false" ]` 是判红的）。
          # 三件事各自判：draft、latest、非空资产列表——少任何一件，这一版对外都不是这一版。
          # `latest` 不是 `gh release view --json` 的字段（v1.18.0 首跑就是死在这：gh 直接报
          # `Unknown JSON field: "latest"` 并列出可用字段，整步 exit 1，发布对象其实已经建好、
          # 资产也挂上了——一格"验证 latest"的判据问了一个 gh 答不出的问题）。"这一版是不是
          # /releases/latest 服务的那一个"由 REST 端点回答，因为它就是 updater 与 install.sh
          # 实际走的那条路。
          READBACK=$(gh release view "$REF_NAME" --json tagName,isDraft,assets,targetCommitish \
            --jq '[(.isDraft|tostring), (.assets|length|tostring), .targetCommitish] | @tsv') \
            || { echo "::error::gh release view $REF_NAME 读不回来（isDraft / assets 一个都没拿到）——发出去没有这一句就没有证据，判红"; exit 1; }
          IFS=$'\t' read -r DRAFT ASSETS TARGET_READ <<<"$READBACK"
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name) \
            || { echo "::error::repos/${GITHUB_REPOSITORY}/releases/latest 读不回来：无法证明这一版就是别人装的时候拿到的那一版，判红"; exit 1; }
          if [ "$DRAFT" != "false" ]; then
            echo "::error::release $REF_NAME 编辑之后读回 isDraft=$DRAFT，它仍然是草稿：/releases/latest 还在服务上一个 tag，" \
              "install.sh 与 updater 取到的都不是这一版，而每台机器会把「查不到更新」读成 up-to-date。"
            exit 1
          fi
          if [ "$LATEST" != "$REF_NAME" ]; then
            echo "::error::/releases/latest 现在服务的是「$LATEST」，不是 $REF_NAME：" \
              "钉着 latest 的安装命令与 updater 装的是上一版的内容。"
            exit 1
          fi
          case "$ASSETS" in
            ''|*[!0-9]*)
              echo "::error::release $REF_NAME 的资产数量读回的是「$ASSETS」，不是一个数字：无法证明归档与签名件挂上了这个发布。"
              exit 1 ;;
          esac
          if [ "$ASSETS" -lt 1 ]; then
            echo "::error::release $REF_NAME 已非草稿但资产列表是空的（assets=0）——没有归档与 SHA256SUMS 的发布，" \
              "updater 第 3 道校验只会拒绝，这一版对外等于没发。"
            exit 1
          fi
          gh release view "$REF_NAME" --json tagName,isDraft,targetCommitish \
            --jq '"release \(.tagName) 已对外：draft=\(.isDraft)，target=\(.targetCommitish)"'
          # target 读不到 ≠ target 对上。从前这一支写作 `[ -n "$TARGET_READ" ] && …`：GitHub 回了
          # 空串时整条判断短路，下面那句"已核实"照样打印，一格绿着说它验过一件它没读到的事。
          # 读回的东西必须先是一枚 commit id，才有资格参与比较。
          case "$TARGET_READ" in
            ''|*[!0-9a-f]*)
              echo "::error::release $REF_NAME 的 targetCommitish 读回的是「$TARGET_READ」，不是一枚 commit id：" \
                "target 无法核实就是**没有核实**，这一版不能被说成钉在这次 checkout 的树上。"
              exit 1 ;;
          esac
          if [ "$TARGET_READ" != "$TARGET_SHA" ] \
            && [ "$TARGET_READ" != "$(git rev-parse --short "$TARGET_SHA")" ]; then
            echo "::error::release $REF_NAME 的 target 读回 $TARGET_READ，不是这次 checkout 的 $TARGET_SHA——发布指向的不是被测试的那棵树。"
            exit 1
          fi
          echo "已核实：draft=$DRAFT，latest=$LATEST，$ASSETS 件资产，target=$TARGET_READ（应为 $TARGET_SHA）"

  npm-publish:
    name: publish bare names with provenance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 60 分钟同样是**判据允许的最坏一次**而不是实测：这一条里同时住着两个 20 分钟级的等待——
    # `assert-ci-green` 的 1200000ms 预算，以及两个包各自最多 24×30s = 12 分钟的 registry 回查
    # （重复版本那支与"退 0 之后必须核实在架"那支各一条，串行）。20 + 12 + 12 + 构建 ≈ 48 分钟，
    # 所以这道闸的额度必须容得下它自己的判据，否则 timeout 就成了"在最慢的那一次红"的另一种写法。
    timeout-minutes: 60
    environment: release
    # Two publishers for the same tag must not interleave: the second `npm publish` of a
    # version is refused by the registry, but the first one's provenance attestation and the
    # second one's attempt are not ordered by anything else, and a re-dispatch while a run is
    # still in flight is how a half-published pair gets made. Queued rather than cancelled —
    # this is the irreversible channel, so nothing may throw away an in-flight publish.
    concurrency:
      group: npm-publish-${{ github.ref_name }}
      cancel-in-progress: false
    # A job-level `permissions:` block REPLACES the workflow-level one, and any scope it does
    # not name becomes `none` for this job — it is not inherited from line 42. `actions/checkout`
    # authenticates the default token, and the refusal check below runs `git ls-remote --tags
    # origin` with it, so a block that names only `id-token` asks the job to read the repository
    # with `contents: none`. Public repositories fall back to anonymous fetches, which is why
    # every publish so far worked; the day this repository is private, or GitHub stops that
    # fallback, the first step dies and the whole npm channel silently stops existing.
    permissions:
      contents: read
      id-token: write
      # Same question as the release-archive job asks, same reason: `actions: read` for the runs API.
      actions: read
    env:
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (staged publishing needs >= 11.15)
        # 钉死 npm@12.2.0，不再飘 `npm@11`：这一台机器握着 OIDC token，几分钟后就要做不可逆的
        # publish，而 `npm@11` 是一条能被人重贴的 dist-tag —— 把第三方代码不带锚点地装进发布机上，
        # 等于自己造出本文件上面那段话警告的那个洞。选 12.2.0 的依据是同一条链上的实测：fork 那条
        # 发布 lane 用同一个数字，并且记下 registry 元数据里带 provenance 的那次发布的
        # `_npmVersion` 就是 12.2.0（见 harness/glasspane-harness 的 release.yml 同名步骤）。
        # 照旧把版本打出来：钉的与实际装上的不一致时，不许被读成"发布成功"。
        run: |
          set -euo pipefail
          # 两条命令，没有 set 就得靠 runner 的默认 shell 兜着：`npm install -g` 失败会退，
          # 但那条 echo 报的"钉死版本"读的是**装上的**那份，装不上时它照样打印一句
          # `npm in this publish lane: <旧版本>`——而下面几步全部按"这台机器上的 npm 是 12.2.0"
          # 做不可逆的 publish。把闸门写在这条正文里，而不是写在默认行为里。
          npm install -g npm@12.2.0
          echo "npm in this publish lane: $(npm --version)"
      - name: Install workspaces from root lockfile
        run: npm ci
      - name: Build all TS workspaces (mcp-shell; the kernel is a published dependency)
        run: npm run build
      - name: Version line must be self-consistent before publishing
        run: node scripts/check-version.mjs
      - name: Refuse to publish a tree no tag vouches for
        # publish 不可逆，而 `check-version` 只证明这份检出**内部**一致：main 的 HEAD 也
        # 满足它。真正的锚点是 dispatch 带没带 `--ref v<X.Y.Z>`（tools/prompts/daily-glasspane-main.md
        # 写的顺序），漏了它这个 job 就把默认分支 HEAD 发上 registry。这里把那件事变成硬前置：
        # MODE 认得、两个要发的包版本一致、origin 上有这个 tag、且 HEAD 就是 tag 指着的那棵树。
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "${MODE:-}" in
            dry|publish) ;;
            *)
              echo "::error::mode 既不是 dry 也不是 publish（现在是「${MODE:-<空>}」）。下面两条发布分支写的是" \
                "「不等于 dry 就 publish」，空值会直接落进不可逆的那一条。重跑：" \
                "gh workflow run release.yml --repo ${GITHUB_REPOSITORY} --ref v<包里的版本> -f mode=dry|publish"
              exit 1 ;;
          esac
          VERSION=$(node -p "require('./package.json').version")
          WANT="v${VERSION}"
          # registry 上那个版本号来自各包自己的 package.json，不是根那份：对照物要点对面
          # 真正出现的东西，根一致而这两个不一致时 check-version 会红，这一道闸也得红。
          for pkg in mcp-shell installer; do
            GOT=$(node -p "require('./${pkg}/package.json').version")
            [ "$GOT" = "$VERSION" ] || {
              echo "::error::${pkg}/package.json 的版本是 ${GOT}，与 tag 应当是的那一条（${WANT}）不一致——" \
                "发上去的包名版本号就不是 ${WANT}。先跑 node scripts/set-version.mjs 把版本线对齐。"
              exit 1; }
          done
          # tag 的存在与指向都问 origin：actions/checkout@v4 默认 fetch-depth=1 且不取 tag，
          # 本地 ref 列表在 CI 里基本是空的，拿 `git tag --points-at HEAD` 判会一律判成"没 tag"。
          LS=$(git ls-remote --tags origin)
          PEELED=$(printf '%s\n' "$LS" | awk -v r="refs/tags/${WANT}^{}" '$2==r{print $1; exit}')
          DIRECT=$(printf '%s\n' "$LS" | awk -v r="refs/tags/${WANT}" '$2==r{print $1; exit}')
          # 附注 tag 用剥到底的那一行（`^{}` 才是 commit），裸 tag 只有 DIRECT。
          TAG_SHA="${PEELED:-$DIRECT}"
          [ -n "$TAG_SHA" ] || {
            echo "::error::origin 上没有 tag ${WANT}——版本线 ${VERSION} 还没打过 tag，发出去的包就没有可复现的" \
              "锚点（install.sh 与 updater 钉的都是 tag）。按顺序补：push → tag ${WANT} → 用 --ref ${WANT} 重跑。"
            exit 1; }
          HEAD_SHA=$(git rev-parse HEAD)
          [ "$TAG_SHA" = "$HEAD_SHA" ] || {
            echo "::error::这份检出不是 ${WANT} 指着的那棵树：HEAD=${HEAD_SHA}，${WANT}=${TAG_SHA}。" \
              "多半是 dispatch 漏了 --ref（这次落在 ${DISPATCH_REF}），于是发的是默认分支 HEAD 的内容。重跑：" \
              "gh workflow run release.yml --repo ${GITHUB_REPOSITORY} --ref ${WANT} -f mode=${MODE}"
            exit 1; }
          # 第三条是同一件事的另一半：provenance 记的是被 dispatch 的那条 ref，树相同而 ref
          # 不对时发出去的东西事后对不回 ${WANT}。
          [ "$DISPATCH_REF" = "refs/tags/${WANT}" ] || {
            echo "::error::dispatch 的 ref 是 ${DISPATCH_REF}，不是 refs/tags/${WANT}。这次的内容虽然与 tag 相同，" \
              "但 provenance 会记成前者。带上 --ref ${WANT} 重跑。"
            exit 1; }
          echo "publish 的对象已核实：${WANT} = ${HEAD_SHA}，mode=${MODE}"
      - name: The CI of this exact commit must be green before the registry gets it
        # 上一条证明"发的是被 tag 的那棵树"，这一条证明"那棵树跑过测试"。两件事彼此独立：
        # v1.16.1 那次两条通道都走完了，而同一 sha 的 CI 是红的（run 38842800885）——当时链子上
        # 没有一环问这个问题。dry 不查：它不发东西，而"tag 之前先把打包形状验一遍"是正常用法。
        env:
          MODE: ${{ github.event.inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${MODE:-dry}" != "publish" ]; then
            echo "mode=${MODE:-dry}：这一步不写 registry，CI 结论留到 publish 那次再问"
            exit 0
          fi
          node scripts/assert-ci-green.mjs \
            --sha "$(git rev-parse HEAD)" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --budget 1200000 --poll 30000
      - name: This tag must already be a public GitHub Release before the registry gets it
        # D2（2026-10-24 复核）：上面两步问的是「这棵树等于这个 tag」与「这棵树的 CI 是绿的」，
        # 没有任何一环问「这个 tag 的 GitHub Release 在不在、对外不对外、资产齐不齐」。两条发布
        # 通道是**故意**不串在一起的（见文件开头），所以 dispatch 一个 `github-release` 从未跑过的
        # tag 这个形状是可达的：registry 上多了两个包，`releases/latest` 继续服务上一版。后果本
        # 文件里 `github-release` 那步已经写死了——`updater/lib/check.js` 把「最新已发布的版本比
        # 本机跑的还旧」读成 `up-to-date` + exit 0，于是每台机器安静地不再更新，而这一格是绿的。
        # `needs: github-release` 不是修法：那个 job 写的是 `if: github.event_name == 'push'`，
        # dispatch 时它是 skipped，而 GitHub 把 needs 上游的 skipped 判成未满足，加上去等于永久
        # 锁死 npm 这条通道。所以这里问的是**状态**而不是**顺序**：Release 存在、非草稿、target
        # 就是本轮 commit、资产非空——四条判据与 `github-release` 那段读回逻辑同一形状，各自单独
        # 变红。dry 模式不查：它不写 registry，而「tag 还没对外」正是 dry 与 publish 之间的正常状态。
        # 字段名以 gh 自己列出的那份为准（`latest` 不在里面；规则 3a2 盯着的就是这件事）。
        env:
          MODE: ${{ github.event.inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${MODE:-dry}" != "publish" ]; then
            echo 'mode 不是 publish：这一步不查 Release——dry 不写 registry，而 tag 还没对外正是 dry 之后、publish 之前的正常状态'
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          WANT="v${VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)
          # 读不回来（404＝这个 tag 根本没有 Release）与读回来不合格是两种红，分开说。
          READBACK=$(gh release view "$WANT" --json tagName,isDraft,assets,targetCommitish \
            --jq '[(.isDraft|tostring), (.assets|length|tostring), (.targetCommitish // "")] | @tsv') \
            || { echo "::error::${WANT} 的 GitHub Release 读不回来（多半是它还没建——打 tag 那条通道没跑过，或它被删了）。" \
              "registry 是不可逆的，所以不发这一版：先 push tag、等 github-release 那一格绿，再重跑 dispatch。"; exit 1; }
          IFS=$'\t' read -r DRAFT ASSET_COUNT TARGET_READ <<<"$READBACK"
          # 三件事各自判，与 github-release 的读回步同口径：少任何一件，对外都不是这一版。
          if [ "${DRAFT:-<空>}" != "false" ]; then
            echo "::error::release ${WANT} 读回 isDraft=${DRAFT:-<空>}，它没有对外：/releases/latest 还在服务上一个 tag，" \
              "每台机器的 updater 会把「查不到更新」读成 up-to-date。这一版不能被放上 registry。"
            exit 1
          fi
          case "${ASSET_COUNT:-}" in
            ''|*[!0-9]*)
              echo "::error::release ${WANT} 的资产数量读回的是「${ASSET_COUNT:-<空>}」，不是一个数字：无法证明归档与签名件挂上了这个发布。"
              exit 1 ;;
          esac
          if [ "${ASSET_COUNT}" -lt 1 ]; then
            echo "::error::release ${WANT} 已非草稿但资产列表是空的（assets=0）——没有归档与 SHA256SUMS 的发布，" \
              "updater 第 3 道校验只会拒绝；把包发上 registry 只是让每台机器多一个装不上去的版本。"
            exit 1
          fi
          case "${TARGET_READ:-}" in
            ''|*[!0-9a-f]*)
              echo "::error::release ${WANT} 的 targetCommitish 读回的是「${TARGET_READ:-<空>}」，不是一枚 commit id：target 无法核实就是没有核实。"
              exit 1 ;;
          esac
          SHORT=$(git rev-parse --short "$HEAD_SHA")
          if [ "${TARGET_READ}" != "${HEAD_SHA}" ] && [ "${TARGET_READ}" != "${SHORT}" ]; then
            echo "::error::release ${WANT} 的 target 读回 ${TARGET_READ}，不是本轮要发的 commit ${HEAD_SHA}——" \
              "Release 服务的是别的树，而 registry 马上要收的是这一棵。两边内容不一致时，装到用户机上的是哪一份没人说得清。"
            exit 1
          fi
          echo "已核实 ${WANT} 的 GitHub Release：draft=${DRAFT}，${ASSET_COUNT} 件资产，target=${TARGET_READ}（本轮 ${HEAD_SHA}）——registry 这一侧现在可以跟上"
      - name: Publish (or pack-check) glasspane-mcp
        working-directory: mcp-shell
        run: |
          set -euo pipefail
          npm run bundle
          if [ "$MODE" = "dry" ]; then
            npm pack --dry-run
            exit 0
          fi
          # 这一段是从 fork 那条 lane 搬过来的判决，替换掉的是一条 `||`。原来那条 `||` 把
          # **任何**失败都走成"直发被拒→stage"：E401、registry 5xx、tarball 本身坏了都进这个分支，
          # 而 stage 退 0 时这一格就绿了——绿着什么都没发。这正是 v0.7.6 那次事故的形状（job 绿、
          # registry 查无此版、装上去没有命令），本仓的 harness SYNCLOG 记着它。stage 只服务一种
          # 情形：TP 配置是 staged-only、注册表拒绝**直发**。其余失败保持失败。
          # 名字与版本都从这一份 manifest 读（working-directory 就是这个包），不在这个文件里再写
          # 一个字面量：写了就有了"文件里的名字与包里的名字不一致"这种账。
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          log="$(mktemp)"
          rc=0
          npm publish --provenance >"$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            if grep -qiE "staged publishing|only allowed through (the )?oidc|trusted publisher|publishing directly is not allowed" "$log"; then
              echo "::notice::registry 拒了 ${pkg}@${ver} 的直发（staged-only trusted publisher）——改为 stage"
              npm stage publish . --provenance
              echo "::error::${pkg}@${ver} 是 staged 而不是 published：这一跑没把任何东西放上 registry，绿就是把「发布成功」交给一个还没存在的包。owner 收尾：npm stage list → npm stage approve <stage-id>（2FA），再重跑这一版。"
              rm -f "$log"
              exit 1
            fi
            # 同一个版本重发（并发组排队的那第二条，或人工重跑 dispatch）会撞上这条拒绝。它不是失败，
            # 但也不能白拿：判据是注册表自己说这一版在不在，而不是"看见这句报错就当没事"。
            if grep -qiE "cannot publish over the previously published versions" "$log"; then
              echo "已发过：${pkg}@${ver} 撞到重复版本拒绝——现在向 registry 核实它确实在"
              got=""
              for attempt in $(seq 1 24); do
                got="$(npm view "${pkg}@${ver}" version --registry https://registry.npmjs.org --prefer-online 2>/dev/null || true)"
                [ "$got" = "$ver" ] && break
                sleep 30
              done
              if [ "$got" != "$ver" ]; then
                echo "::error::${pkg}@${ver} 被当成重复版本拒了，但轮询 12 分钟后 registry 答的仍是 ${got:-nothing}——这就是 v0.7.6 的形状（绿着，registry 查无此版），保持红"
                rm -f "$log"
                exit 1
              fi
              echo "registry 确认在架：${pkg}@${ver}（第 $attempt 次轮询答对）"
              rm -f "$log"
              exit 0
            fi
            echo "::error::${pkg}@${ver} 发布失败（exit $rc），而输出里没有任何一句说注册表拒了直发——不盲签 stage"
            rm -f "$log"
            exit "$rc"
          fi
          # 退 0 也不算数：这一格存在的理由是"registry 上有了这一版"，那句话只能由 registry 回答。
          got=""
          for attempt in $(seq 1 24); do
            got="$(npm view "${pkg}@${ver}" version --registry https://registry.npmjs.org --prefer-online 2>/dev/null || true)"
            [ "$got" = "$ver" ] && break
            sleep 30
          done
          if [ "$got" != "$ver" ]; then
            echo "::error::npm publish 退 0，但 12 分钟轮询后 registry 上 ${pkg} 的这一版答的是 ${got:-nothing}——发出去了才算发出去了，保持红"
            rm -f "$log"
            exit 1
          fi
          rm -f "$log"
          echo "published and confirmed on the registry: ${pkg}@${ver}"
      - name: Publish (or pack-check) glasspane-install
        working-directory: installer
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry" ]; then
            npm pack --dry-run
            exit 0
          fi
          # 与上一条同样的判决（见那里的注释）：只有"注册表拒了直发"这一种失败才允许 stage，且 stage
          # 之后判红；其余失败原样退出；退 0 之后再向 registry 核实这一版确实在架。两个包各自读自己的
          # manifest，不共用这个文件里的名字。
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          log="$(mktemp)"
          rc=0
          npm publish --provenance >"$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            if grep -qiE "staged publishing|only allowed through (the )?oidc|trusted publisher|publishing directly is not allowed" "$log"; then
              echo "::notice::registry 拒了 ${pkg}@${ver} 的直发（staged-only trusted publisher）——改为 stage"
              npm stage publish . --provenance
              echo "::error::${pkg}@${ver} 是 staged 而不是 published：这一跑没把任何东西放上 registry，绿就是把一次不存在的发布报成成功。owner 收尾：npm stage list → npm stage approve <stage-id>（2FA），再重跑这一版。"
              rm -f "$log"
              exit 1
            fi
            if grep -qiE "cannot publish over the previously published versions" "$log"; then
              echo "已发过：${pkg}@${ver} 撞到重复版本拒绝——现在向 registry 核实它确实在"
              got=""
              for attempt in $(seq 1 24); do
                got="$(npm view "${pkg}@${ver}" version --registry https://registry.npmjs.org --prefer-online 2>/dev/null || true)"
                [ "$got" = "$ver" ] && break
                sleep 30
              done
              if [ "$got" != "$ver" ]; then
                echo "::error::${pkg}@${ver} 被当成重复版本拒了，但轮询 12 分钟后 registry 答的仍是 ${got:-nothing}——这就是 v0.7.6 的形状（绿着，registry 查无此版），保持红"
                rm -f "$log"
                exit 1
              fi
              echo "registry 确认在架：${pkg}@${ver}（第 $attempt 次轮询答对）"
              rm -f "$log"
              exit 0
            fi
            echo "::error::${pkg}@${ver} 发布失败（exit $rc），而输出里没有任何一句说注册表拒了直发——不盲签 stage"
            rm -f "$log"
            exit "$rc"
          fi
          got=""
          for attempt in $(seq 1 24); do
            got="$(npm view "${pkg}@${ver}" version --registry https://registry.npmjs.org --prefer-online 2>/dev/null || true)"
            [ "$got" = "$ver" ] && break
            sleep 30
          done
          if [ "$got" != "$ver" ]; then
            echo "::error::npm publish 退 0，但 12 分钟轮询后 registry 上 ${pkg} 的这一版答的是 ${got:-nothing}——发出去了才算发出去了，保持红"
            rm -f "$log"
            exit 1
          fi
          rm -f "$log"
          echo "published and confirmed on the registry: ${pkg}@${ver}"
