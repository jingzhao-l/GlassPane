name: Release
# 两条独立的发布动作，故意**不**串在一起：
#   1) GitHub Release（打 tag 即触发，自动）：确定性源码 tarball + SHA256SUMS.txt，
#      两者各带一份 GPG detached 签名。install.sh / npx 钉的就是这个 tag，用户据此可复现
#      同一份源码；签名是 updater 第 8 道校验（作者性）的判据，签不出来就不发这一版。
#   2) npm publish（手动 workflow_dispatch，默认 dry）：两个裸名包带 provenance。
#      不挂在 tag 事件上，因为"发了 tag"不等于"决定对外发版"——发布不可逆，
#      必须是一次显式操作。
#
# 前置已于 2026-09-22 满足：两个包（glasspane-mcp / glasspane-install）在
# npmjs.com 各配了一条 GitHub Actions Trusted Publisher，仓库
# jingzhao-l/GlassPane、工作流 release.yml、环境 release。发布授权留在人手里靠的是
# **触发本身**：npm 这条只认 workflow_dispatch 且 mode=publish，打 tag 不会发版
# （GitHub Release 与 npm publish 是两条独立动作，见文件开头）。
#   · 2026-09-29 发 1.4.0 实测：trusted publisher **直发成功**，provenance 进了 sigstore
#     透明日志，没有产生任何 stage 件。这里此前写的「"publish directly" 未勾
#     （staged only）」已不成立 —— 别按那句话去终端找 `npm stage approve`。
#   · 万一哪天直发被拒（TP 配置改回 staged-only，或 npm 对 bypass-2FA token 的策略
#     收紧），下面的 `|| npm stage publish` 分支接住，owner 用
#     `npm stage approve <stage-id>`（2FA）兑现存在。
# npm CLI ≥ 11.15 才有 stage 子命令，故先全局升 npm@11；不配 NPM_TOKEN
# （空 token 会被 setup-node 写进 .npmrc，反而挡住 OIDC）。
# npm 11 行为变化：`npm publish --dry-run` 不再纯本地、会查 registry 撞已发
# 版本，所以 dry 分支一律用 `npm pack --dry-run`。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: "publish 前先只做打包校验？"
        type: choice
        required: true
        default: dry
        options:
          - dry
          - publish

permissions:
  contents: read

jobs:
  github-release:
    name: source tarball + SHA256SUMS
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 签名私钥配在这个环境里，job 不声明它就读不到 —— v1.4.0 首跑正是因为没声明，
    # detect 步走了"没配"那条分支，于是照常发了货、只是没有 .asc。环境本身无保护规则
    # （protection_rules 为空、can_admins_bypass），所以声明它不会给打 tag 增加人工审批。
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tag and version line
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ref 来自事件字段：先按 semver tag 形状校验，再使用（不直接插进 shell）。
          case "$REF_NAME" in
            v[0-9]*) ;;
            *) echo "::error::tag 形状不是 vX.Y.Z：$REF_NAME"; exit 1 ;;
          esac
          VERSION="${REF_NAME#v}"
          node scripts/check-version.mjs "$VERSION"
          # 后续步骤各自独立 shell：校验过的值经 GITHUB_ENV 传下去，
          # 不在下游重新读事件字段（set -u 下 v1.1.0 首跑就是栽在这）。
          {
            echo "REF_NAME=$REF_NAME"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Build deterministic source archive
        run: |
          set -euo pipefail
          # 从被 tag 的树自己打包，而不是依赖 GitHub 自动生成的 tarball——
          # 只有自己生成的才配得上同时发布的 SHA256SUMS.txt。
          git archive --format=tar.gz --prefix="GlassPane-${VERSION}/" \
            -o "GlassPane-${VERSION}.tar.gz" HEAD
          sha256sum "GlassPane-${VERSION}.tar.gz" > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"
      - name: Sign release artifacts with GPG
        # 签名是**必须成功的一步**，不是 best-effort。这一份 `.asc` 是 updater 第 8 道校验
        # （作者性）唯一的判据：没有它，每一次定时更新都会停在 needs-consent，"自动更新"这个
        # 功能对外等于没有 —— 而 v1.4.0 的首跑正是这样一个 release（签名步被静默跳过，货照样
        # 发）。宁可这一版发不出去，也不发一个下游必然拒绝自动应用的产物：这一步失败时"建
        # Release"还没执行，什么对外可见的东西都没留下。
        # 未配置或口令不对都归一为"这一步失败"；remedy 说清配在哪、用哪条命令。
        env:
          GPG_INPUT_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_INPUT_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY 读不到。签名私钥配在 release 环境，本 job 已声明该环境，" \
              "所以读不到只有两种可能：secret 没配，或被改名。配法：" \
              "printf '%s' <armored 私钥> | gh secret set GPG_PRIVATE_KEY --env release，" \
              "口令同理（--env release 而非仓库级）。修好之前不发版。"
            exit 1
          fi
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_INPUT_KEY" | gpg --batch --yes --import
          for f in "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$f"
          done
          # 两份签名件都得存在且非空：少一份就是这一步没做完，而"做完"的证据只能来自文件系统，
          # 不能来自 gpg 的退出码（空输入、口令不对都可能是退 0 而不落盘）。
          for f in "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"; do
            [ -s "${f}.asc" ] || { echo "::error::${f}.asc 缺失或为空 —— 签名没有真的产出"; exit 1; }
          done
          ls -la *.asc
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Release ${VERSION}. Source archive checksum: see \`SHA256SUMS-${VERSION}.txt\`, which is GPG-signed — \`gpg --verify SHA256SUMS-${VERSION}.txt.asc SHA256SUMS-${VERSION}.txt\`."
          NOTES="$NOTES"$'\n\n'"Install (one command, clones this tag): \`curl -fsSL https://raw.githubusercontent.com/jingzhao-l/GlassPane/main/install.sh | sh\`"
          NOTES="$NOTES"$'\n\n'"See [CHANGELOG.md](https://github.com/jingzhao-l/GlassPane/blob/${REF_NAME}/CHANGELOG.md) for what changed."
          # target 显式钉在被 checkout 的 commit 上：gh 默认会写成分支名，
          # 那样 Release 的 target 就与 tag 内容脱钩，可复现性锚点只剩资产本身。
          TARGET_SHA=$(git rev-parse HEAD)
          # 四件一起传，签名件按名字点名：上一步已经保证两份 .asc 都存在且非空，所以这里
          # 不再"存在才带上"（那种形状正是把静默降级写进发布路径）。
          ASSETS=()
          for f in "GlassPane-${VERSION}.tar.gz" "SHA256SUMS-${VERSION}.txt"; do
            ASSETS+=("$f" "${f}.asc")
          done
          # 用默认 GITHUB_TOKEN 建的 Release 会落为 draft（GitHub 对 Actions
          # 身份建的发布默认不直接对外），不显式取消就永远只挂在 /releases 草稿区。
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$REF_NAME" --notes "$NOTES" --target "$TARGET_SHA"
          else
            gh release create "$REF_NAME" \
              "${ASSETS[@]}" \
              --title "GlassPane ${VERSION}" --notes "$NOTES" --target "$TARGET_SHA"
          fi
          gh release edit "$REF_NAME" --draft=false --latest
          gh release view "$REF_NAME" --json tagName,isDraft,targetCommitish \
            --jq '"release \(.tagName) 已对外：draft=\(.isDraft)，target=\(.targetCommitish)"'

  npm-publish:
    name: publish bare names with provenance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (staged publishing needs >= 11.15)
        run: npm install -g npm@11
      - name: Install workspaces from root lockfile
        run: npm ci
      - name: Build all TS workspaces (kernel first; mcp-shell imports it)
        run: npm run build
      - name: Version line must be self-consistent before publishing
        run: node scripts/check-version.mjs
      - name: Publish (or pack-check) glasspane-mcp
        working-directory: mcp-shell
        run: |
          set -euo pipefail
          npm run bundle
          if [ "$MODE" = "dry" ]; then
            npm pack --dry-run
          else
            npm publish --provenance || {
              echo "::notice::direct publish refused (staged-only trusted publisher)"
              npm stage publish . --provenance
              echo "::notice::staged publish created — owner approves with: npm stage approve <stage-id> (see npm stage list)"
            }
          fi
      - name: Publish (or pack-check) glasspane-install
        working-directory: installer
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry" ]; then
            npm pack --dry-run
          else
            npm publish --provenance || {
              echo "::notice::direct publish refused (staged-only trusted publisher)"
              npm stage publish . --provenance
              echo "::notice::staged publish created — owner approves with: npm stage approve <stage-id> (see npm stage list)"
            }
          fi
