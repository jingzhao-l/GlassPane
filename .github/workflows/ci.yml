name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift:
    name: engine (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine
        working-directory: engine
        run: swift build
      - name: Test engine (pure-logic suite, no GUI permission needed)
        working-directory: engine
        run: swift test
      - name: Test probe SDK package (GlassPaneProbe SPM target)
        working-directory: engine/probe
        run: swift test
      - name: Signal teardown gate (SIGTERM/SIGINT clean exit + socket unlink)
        working-directory: engine
        run: python3 .signal_smoke.py .build/debug/glasspaned

  bridge:
    name: LLDB bridge (Python, pure-logic suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (the bridge suite has no other third-party dep)
        run: python3 -m pip install --quiet pytest
      - name: Test bridge (queue/truncation/sentinel/argv/socket loopback)
        run: python3 -m pytest -q
        working-directory: bridge

  kernel:
    name: kernel (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kernel/package-lock.json
      - name: Install kernel deps
        working-directory: kernel
        run: npm ci
      - name: Build + test kernel (C35 roundtrip vs fixtures)
        working-directory: kernel
        run: npm test

  mcp-shell:
    name: mcp-shell (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-shell/package-lock.json
      - name: "Install kernel (local file: dep)"
        working-directory: kernel
        run: npm ci
      - name: Install mcp-shell deps
        working-directory: mcp-shell
        run: npm ci
      - name: Build kernel first (mcp-shell imports it via file:../kernel)
        working-directory: kernel
        run: npm run build
      - name: Test mcp-shell (dispatch + tools + engine client)
        working-directory: mcp-shell
        run: npm test
      - name: Publish-shape guard (bundle + npm pack + clean-room initialize)
        # 守的是发布形态本身：prepublishOnly 的捆绑产物在干净环境必须能装上并
        # 完成 MCP initialize 握手（file: 依赖泄漏、schemas 缺文件都在这一步现形）。
        working-directory: mcp-shell
        run: |
          set -euo pipefail
          npm run bundle
          PKG=$(npm pack --silent | tail -1)
          # Actions 给 run 块的默认 shell 是 `bash -e`，**不带 pipefail**：`npm pack` 失败时
          # 管道的退出码取自 `tail -1`（它是 0），PKG 就成了空串，下面那个安装路径退化成
          # `$GITHUB_WORKSPACE/mcp-shell/` —— 一个目录。npm 装目录照样成功，于是这道闸
          # 测的是工作树源码而不是发布件，末尾照样打印 OK。三道检查按名字点名各自缺的东西。
          [ -n "$PKG" ] || {
            echo "::error::npm pack 没有报出文件名（它失败了，或它报的不是文件名）。" \
              "继续下去安装路径会变成 mcp-shell/ 源码目录本身，这道闸就什么也没测到。" \
              "先看上面 npm pack 的 stderr 再重跑。"
            exit 1
          }
          [ -f "$GITHUB_WORKSPACE/mcp-shell/$PKG" ] || {
            echo "::error::npm pack 报出的 $PKG 不在 $GITHUB_WORKSPACE/mcp-shell/ 下——" \
              "装的就不是这一份打包产物，这道闸测不到发布形态，停下来。"
            exit 1
          }
          case "$PKG" in
            *.tgz) ;;
            *) echo "::error::$PKG 不是一个 tarball 文件名；npm pack 的输出形状变了，别再猜它报了哪一行"; exit 1 ;;
          esac
          rm -rf /tmp/gp-packtest && mkdir -p /tmp/gp-packtest
          cd /tmp/gp-packtest
          printf '{"name":"t","private":true}\n' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/mcp-shell/$PKG"
          python3 - <<'PYEOF'
          import json, subprocess
          p = subprocess.Popen(["node_modules/.bin/glasspane-mcp"], stdin=subprocess.PIPE,
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                               cwd="/tmp/gp-packtest")
          req = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2024-11-05", "capabilities": {},
              "clientInfo": {"name": "ci", "version": "1"}}}
          out, err = p.communicate(json.dumps(req) + "\n", timeout=15)
          assert "glasspane-mcp" in out, ("initialize handshake failed", out[:200], err[:200])
          print("publish-shape guard OK")
          PYEOF

  # 根 workspace 全绿守护：installer + kernel + mcp-shell 从仓库根统一安装/构建/测试，
  # 防止"单包绿但根布局/workspaces 依赖漂移"漏出——发布形态以根为准。
  install-gate:
    name: root workspace gate (installer + all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root
        run: npm ci
      - name: Installer unit tests (parse/env/plist/app args)
        run: npm test --workspace glasspane-install
      - name: Build all TS workspaces (kernel → mcp-shell)
        run: npm run build
      - name: Test all workspaces (kernel + mcp-shell)
        run: npm run test --workspaces --if-present

  # 对外文档守卫：死链、失效锚点、双语成对（README/SECURITY/CONTRIBUTING 任一侧
  # 改名或漏翻译都在这里现形——面向陌生读者的文档，链接断了等于没交付）。
  docs:
    name: public docs (links, anchors, bilingual parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check links, anchors and bilingual pairing across public docs
        run: node scripts/check-doc-links.mjs

  # 版本线守卫：根 workspace / 两个 npm 包 / kernel / MCP 自报 / daemon 自报 /
  # .app bundle / install.sh 钉的 tag / lockfile 必须是同一个数字。漂移的后果不是
  # 难看而是危险：用户按 tag 装到的源码，和 registry 上的包、面板里显示的版本对不上。
  version-line:
    name: version line (single source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every derived site agrees with root package.json
        run: node scripts/check-version.mjs

  # harness 尺子层守卫。这条 lane 的存在理由是一次真实事故：harness 的开发长期
  # 寄生在 worktree（gp-fork），收编进主仓时只带进了 fork 本体，harness/tools 与
  # harness/contracts 整体没进版本控制——而 FORK.md 把「分叉必须可测量」列为不可
  # 让步纪律并给出 4 条命令，其中 3 条在 main 上是 MODULE_NOT_FOUND。主仓 CI 里
  # `grep -c harness` 当时是 0，所以没有任何东西会发现这件事，直到发布出的安装器
  # 被人用。尺子必须和 fork 同仓（harness/README.md 开篇即此意），这条 lane 是
  # 「尺子丢了」这件事的报警器。
  #
  # 不装上游参照检出（.external/opencode，223 MB）：fork-diff 与 tool-surface 在
  # 没有参照时仍核我们这一侧，并如实打印「上游未在此观测」；hook-liveness 走
  # --offline，只做金样自洽并声明未观测上游。整包构建 >10 分钟且需要一张本机才有的
  # 拦截根证书，不进 CI——闸是按包的固定点测试 + 这几把尺子。
  harness-rulers:
    name: harness rulers (divergence, surfaces, branding, kernel provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 尺子自己不在仓里时，命令会以 MODULE_NOT_FOUND 失败——这正是要抓的形态，
      # 所以先断言它们在，再逐个跑。
      - name: The rulers are in the tree (the 2026-09-28 regression)
        run: |
          set -euo pipefail
          missing=0
          for f in fork-diff tool-surface brand-surface product-surface surface-semantics hook-liveness; do
            if [ ! -f "harness/tools/$f.mjs" ]; then echo "::error::harness/tools/$f.mjs is missing from the tree"; missing=1; fi
          done
          for f in fork-diff tool-surface brand-surface surface-semantics hook-liveness; do
            if [ ! -f "harness/contracts/$f.json" ]; then echo "::error::harness/contracts/$f.json is missing from the tree"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "rulers present"

      # 上游参照检出（pinned tag，`--depth 1`，不进版本控制）。tool-surface 与
      # fork-diff 需要它做两件没有它就做不到的事：逐文件 blob 比对，以及识别
      # 「纯改名」。后者不是优化而是正确性：私有化把 63 个 locale 文件里的上游名
      # 换成本产品名，那是 2,700 行 find-and-replace 而非谁写的代码；没有参照检出
      # 就识别不出这些是 move，于是把它们算成我们的行，面 B 从 17% 虚报到 20%。
      # 该工具在没有参照时**故意**拒绝（"an unmeasured surface cannot be declared
      # within limits"），所以这里必须提供参照，而不是放宽它。
      - name: Fetch the pinned upstream reference clone (shallow)
        run: |
          set -euo pipefail
          tag="$(node -p "require('./harness/upstream.json').tag")"
          echo "pinning upstream at $tag"
          git clone --quiet --branch "$tag" --depth 1 https://github.com/anomalyco/opencode.git .external/opencode
          got="$(git -C .external/opencode describe --tags)"
          [ "$got" = "$tag" ] || { echo "::error::reference clone is at $got, not the pinned $tag"; exit 1; }

      - name: Divergence matches the recorded surface
        run: node harness/tools/fork-diff.mjs --check

      - name: Tool surfaces did not grow past the recorded baseline
        run: node harness/tools/tool-surface.mjs --check

      - name: Neither surface started judging evidence semantics
        run: node harness/tools/surface-semantics.mjs --check

      - name: No unrecorded brand drift
        run: node harness/tools/brand-surface.mjs --check

      - name: Product manifest, build, publish and installers agree
        run: node harness/tools/product-surface.mjs

      - name: Extension points are still live at the pinned upstream tag
        run: node harness/tools/hook-liveness.mjs --check

      # 内核改依赖之后，出处检查要看得到装出来的那份包。第一次 CI 跑这段时它红了：
      # `kernel-pin: iterate-kernel is not installed — run 'bun install' …`，退出码 2。
      # 那不是回归而是这道闸的正确行为——测不到被测量物时它拒绝说绿。这里的修法是给它
      # 需要的安装，而不是放宽判据。bun 版本从 fork 自己的 packageManager 单点解析，
      # 不在这个文件里再写一个字面量（写了就会有"CI 装的 bun 与产品钉的不一样"这种账）。
      - name: "Resolve the pinned bun version (single source: the fork's packageManager)"
        id: bunver
        run: |
          set -euo pipefail
          pm="$(node -p "require('./harness/glasspane-harness/package.json').packageManager")"
          case "$pm" in
            bun@*) ;;
            *) echo "::error::packageManager is not a bun pin: $pm"; exit 1 ;;
          esac
          echo "version=${pm#bun@}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bunver.outputs.version }}

      - name: Install the fork workspace (frozen lockfile)
        working-directory: harness/glasspane-harness
        run: bun install --frozen-lockfile

      - name: The installed bun is the pinned bun
        env:
          WANT_BUN: ${{ steps.bunver.outputs.version }}
        run: |
          set -euo pipefail
          got="$(bun --version)"
          if [ "$got" != "$WANT_BUN" ]; then
            echo "::error::bun $got on PATH, packageManager pins $WANT_BUN"
            exit 1
          fi
          echo "bun $got matches the pin"

      - name: The kernel dependency still matches its provenance manifest
        run: node harness/glasspane-harness/script/kernel-pin.mjs --check

      # 哈希只证明装到的是那一份；这条证明那份的行为还是我们依赖的那些答案——10 条
      # fixture 对着 contracts/kernel-conformance.json 的摘要与 fixture 自带的期望跑。
      - name: Kernel behaviour answers as recorded (fixtures through the installed kernel)
        working-directory: harness/glasspane-harness
        run: bun script/kernel-conformance.mjs

  # 工作流可编译性守卫。GitHub 拒绝解析的工作流不产生任何 job 日志：它在解析期整体
  # 作废，之后每次触发只留下一个 0 步、名为文件路径的红色 run。c3797d4 用
  # `if: ${{ secrets.X != '' }}`（secrets 不是 step if 的合法 context）把 Release 链
  # 锁死，main 上连着六次 push 只表现为"又一个看不懂的红灯"，签名步骤因此从未跑过。
  # 这条守卫的意义不是"少一步"而是"整条链还在不在"。
  workflow-lint:
    name: GitHub Actions workflows compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject workflow files GitHub would refuse to load
        run: |
          node scripts/check-workflows.mjs --self-test
          node scripts/check-workflows.mjs