name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift:
    name: engine (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine
        working-directory: engine
        run: swift build
      - name: Test engine (pure-logic suite, no GUI permission needed)
        working-directory: engine
        run: swift test
      - name: Test probe SDK package (GlassPaneProbe SPM target)
        working-directory: engine/probe
        run: swift test
      - name: Signal teardown gate (SIGTERM/SIGINT clean exit + socket unlink)
        working-directory: engine
        run: python3 .signal_smoke.py .build/debug/glasspaned

  bridge:
    name: LLDB bridge (Python, pure-logic suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (the bridge suite has no other third-party dep)
        run: python3 -m pip install --quiet pytest
      - name: Test bridge (queue/truncation/sentinel/argv/socket loopback)
        run: python3 -m pytest -q
        working-directory: bridge

  kernel:
    name: kernel (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kernel/package-lock.json
      - name: Install kernel deps
        working-directory: kernel
        run: npm ci
      - name: Build + test kernel (C35 roundtrip vs fixtures)
        working-directory: kernel
        run: npm test

  mcp-shell:
    name: mcp-shell (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-shell/package-lock.json
      - name: "Install kernel (local file: dep)"
        working-directory: kernel
        run: npm ci
      - name: Install mcp-shell deps
        working-directory: mcp-shell
        run: npm ci
      - name: Build kernel first (mcp-shell imports it via file:../kernel)
        working-directory: kernel
        run: npm run build
      - name: Test mcp-shell (dispatch + tools + engine client)
        working-directory: mcp-shell
        run: npm test
      - name: Publish-shape guard (bundle + npm pack + clean-room initialize)
        # 守的是发布形态本身：prepublishOnly 的捆绑产物在干净环境必须能装上并
        # 完成 MCP initialize 握手（file: 依赖泄漏、schemas 缺文件都在这一步现形）。
        working-directory: mcp-shell
        run: |
          npm run bundle
          PKG=$(npm pack --silent | tail -1)
          rm -rf /tmp/gp-packtest && mkdir -p /tmp/gp-packtest
          cd /tmp/gp-packtest
          printf '{"name":"t","private":true}\n' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/mcp-shell/$PKG"
          python3 - <<'PYEOF'
          import json, subprocess
          p = subprocess.Popen(["node_modules/.bin/glasspane-mcp"], stdin=subprocess.PIPE,
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                               cwd="/tmp/gp-packtest")
          req = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2024-11-05", "capabilities": {},
              "clientInfo": {"name": "ci", "version": "1"}}}
          out, err = p.communicate(json.dumps(req) + "\n", timeout=15)
          assert "glasspane-mcp" in out, ("initialize handshake failed", out[:200], err[:200])
          print("publish-shape guard OK")
          PYEOF

  # 根 workspace 全绿守护：installer + kernel + mcp-shell 从仓库根统一安装/构建/测试，
  # 防止"单包绿但根布局/workspaces 依赖漂移"漏出——发布形态以根为准。
  install-gate:
    name: root workspace gate (installer + all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root
        run: npm ci
      - name: Installer unit tests (parse/env/plist/app args)
        run: npm test --workspace glasspane-install
      - name: Build all TS workspaces (kernel → mcp-shell)
        run: npm run build
      - name: Test all workspaces (kernel + mcp-shell)
        run: npm run test --workspaces --if-present
      # 上游不在本 lane 被观测（142 MB tarball，且失败与本次提交无关）；这里只验
      # 金样自洽与坐标一致性，真·上游探查在 harness-contract.yml 的周跑里。
      - name: Harness contract — golden self-consistency (offline)
        run: node harness/tools/hook-liveness.mjs --offline

  # 对外文档守卫：死链、失效锚点、双语成对（README/SECURITY/CONTRIBUTING 任一侧
  # 改名或漏翻译都在这里现形——面向陌生读者的文档，链接断了等于没交付）。
  docs:
    name: public docs (links, anchors, bilingual parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check links, anchors and bilingual pairing across public docs
        run: node scripts/check-doc-links.mjs

  # 版本线守卫：根 workspace / 两个 npm 包 / kernel / MCP 自报 / daemon 自报 /
  # .app bundle / install.sh 钉的 tag / lockfile 必须是同一个数字。漂移的后果不是
  # 难看而是危险：用户按 tag 装到的源码，和 registry 上的包、面板里显示的版本对不上。
  version-line:
    name: version line (single source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every derived site agrees with root package.json
        run: node scripts/check-version.mjs