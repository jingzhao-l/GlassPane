name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限（与 release.yml、harness-contract.yml 同一口径）：这里不声明，每个 PR 触发的
# job 就继承仓库默认权限（组织级常为 write）。逐 job 核过：下面每一条 job 用到的 action 只有
# checkout、setup-python/setup-node 与那条钉死 SHA 的 setup-bun，全文没有 upload-artifact、
# 没有 GITHUB_TOKEN、没有 `gh pr|api|release`、没有 git push/tag、没有评论或 release 写入。
# 曾经写在这里的 `kernel` job 已随内核镜像退场（2026-10-18），计数也一并去掉——条数由
# `node scripts/check-workflows.mjs` 数出来，job 名单与各自 runner 由
# `node scripts/check-workflows.mjs --jobs` 数出来：抄在注释里的那一份名单每加一条 job 就漂一次
# （新增 `macos-node-gate` 那一轮就是这样——原先这里点名九条 job 的括号已经过期了）。
# harness-rulers 里的 `git clone` 拉的是公开的上游参照仓，匿名即可完成，不需要 token；
# 其余步骤只读工作树、跑本地脚本。所以顶层一条 `contents: read` 覆盖全部 job。
permissions:
  contents: read

# 每条 job 都带 `timeout-minutes`（2026-10-24 复核 D5：这条文件原来一条都没有，14 个 job 全在
# GitHub 默认的 6 小时上跑）。默认值不是"没人管"而是"没人管 6 小时"：一次 hung 的 `swift test`、
# 一个卡在 `npm ci` 的网络、一条停在 lldb attach 上的用例，都要占着并发额度到第六个小时才红，
# 而这条 lane 的结论就是当天能不能收工。数值不是拍的：取自主仓最近若干次 run 的 job 实测耗时
# （`gh api repos/<repo>/actions/runs/<id>/jobs`，1.20.1 前后），再按各自最慢的一条放大到 5–8 倍——
# 宁可宽一档也不能比实际短，一条被 timeout 咬掉的正常发布比一条慢的 CI 贵得多。macOS 那三条
# （swift 429s、macos-node-gate 229s、publish-gate-selftest 51s）给到 30 分钟。
jobs:
  swift:
    name: engine (Swift)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build engine
        working-directory: engine
        run: swift build
      - name: Test engine (pure-logic suite, no GUI permission needed)
        working-directory: engine
        # pipefail 是这条闸的一半：没有它，`swift test | tee` 的退出码是 tee 的，
        # 一趟真失败的测试会被包装脚本判成绿（本仓栽过：包装脚本的退出码不可信）。
        # -e 与 -u 同批补上（2026-10-24 复核 D6）：`check-workflows.mjs` 现在要求每条 run 正文
        # 自己声明闸门，而不是押在 Actions 给 run 块的那个默认 shell 上——默认是 `bash -e`，
        # 而"默认"是 runner 镜像的行为，不是这个文件承诺过的行为。
        run: |
          set -euo pipefail
          swift test 2>&1 | tee /tmp/gp-engine-tests.log
      - name: Test probe SDK package (GlassPaneProbe SPM target)
        working-directory: engine/probe
        run: |
          set -euo pipefail
          swift test 2>&1 | tee /tmp/gp-probe-tests.log
      - name: "测试计数闸：一条用例都没跑不许算绿"
        # `swift test` 的退出码只说"没失败"，不说"有没有东西在跑"：用例全删掉、glob 匹配空、
        # target 一条都没链上，这一格照样绿。两种 runner（XCTest 与 Swift Testing）各自的行
        # 都必须出现，且合起来的数量过下限——下限由调用方给，钉一个会衰减的大数会把正常改动
        # 变成红，那是另一种假绿。判据与反例见 scripts/assert-test-count.mjs 与其测试。
        run: node scripts/assert-test-count.mjs swift 1 /tmp/gp-engine-tests.log /tmp/gp-probe-tests.log
      - name: Signal teardown gate (SIGTERM/SIGINT clean exit + socket unlink)
        working-directory: engine
        run: python3 .signal_smoke.py .build/debug/glasspaned

  bridge:
    name: LLDB bridge (Python, pure-logic suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (the bridge suite has no other third-party dep)
        run: python3 -m pip install --quiet pytest
      - name: Test bridge (queue/truncation/sentinel/argv/socket loopback)
        run: python3 -m pytest -q
        working-directory: bridge

  mcp-shell:
    name: mcp-shell (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-shell/package-lock.json
      - name: Install mcp-shell deps
        working-directory: mcp-shell
        run: npm ci
      - name: Test mcp-shell (dispatch + tools + engine client)
        working-directory: mcp-shell
        run: npm test
      - name: Publish-shape guard (bundle + npm pack + clean-room initialize)
        # 守的是发布形态本身：prepublishOnly 的捆绑产物在干净环境必须能装上并
        # 完成 MCP initialize 握手（file: 依赖泄漏、schemas 缺文件都在这一步现形）。
        working-directory: mcp-shell
        run: |
          set -euo pipefail
          npm run bundle
          PKG=$(npm pack --silent | tail -1)
          # Actions 给 run 块的默认 shell 是 `bash -e`，**不带 pipefail**：`npm pack` 失败时
          # 管道的退出码取自 `tail -1`（它是 0），PKG 就成了空串，下面那个安装路径退化成
          # `$GITHUB_WORKSPACE/mcp-shell/` —— 一个目录。npm 装目录照样成功，于是这道闸
          # 测的是工作树源码而不是发布件，末尾照样打印 OK。三道检查按名字点名各自缺的东西。
          [ -n "$PKG" ] || {
            echo "::error::npm pack 没有报出文件名（它失败了，或它报的不是文件名）。" \
              "继续下去安装路径会变成 mcp-shell/ 源码目录本身，这道闸就什么也没测到。" \
              "先看上面 npm pack 的 stderr 再重跑。"
            exit 1
          }
          [ -f "$GITHUB_WORKSPACE/mcp-shell/$PKG" ] || {
            echo "::error::npm pack 报出的 $PKG 不在 $GITHUB_WORKSPACE/mcp-shell/ 下——" \
              "装的就不是这一份打包产物，这道闸测不到发布形态，停下来。"
            exit 1
          }
          case "$PKG" in
            *.tgz) ;;
            *) echo "::error::$PKG 不是一个 tarball 文件名；npm pack 的输出形状变了，别再猜它报了哪一行"; exit 1 ;;
          esac
          rm -rf /tmp/gp-packtest && mkdir -p /tmp/gp-packtest
          cd /tmp/gp-packtest
          printf '{"name":"t","private":true}\n' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/mcp-shell/$PKG"
          python3 - <<'PYEOF'
          import json, subprocess
          p = subprocess.Popen(["node_modules/.bin/glasspane-mcp"], stdin=subprocess.PIPE,
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                               cwd="/tmp/gp-packtest")
          req = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2024-11-05", "capabilities": {},
              "clientInfo": {"name": "ci", "version": "1"}}}
          out, err = p.communicate(json.dumps(req) + "\n", timeout=15)
          assert "glasspane-mcp" in out, ("initialize handshake failed", out[:200], err[:200])
          print("publish-shape guard OK")
          PYEOF

  # 根 workspace 全绿守护：installer + mcp-shell + updater 从仓库根统一安装/构建/测试，
  # 防止"单包绿但根布局/workspaces 依赖漂移"漏出——发布形态以根为准。
  install-gate:
    name: root workspace gate (installer + all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root
        run: npm ci
      # 镜像语料必须等于 pin 记录的已发布语料：Swift 的 C35 腿（TestSupport.swift）直读
      # kernel/fixtures，镜像落后 pin 就等于引擎侧对之后的契约全盲——本批实测踩过一次，
      # 报错还是"文件不存在"这种看起来像测试写错的样子。
      # 这条闸今天还多核一件事：mcp-shell 捆的内核版本 == fork 钉的那一版（两个消费者一份契约）。
      - name: Kernel corpus matches the pin (Swift C35 leg's truth source)
        run: node scripts/check-kernel-corpus.mjs
      - name: Installer unit tests (parse/env/plist/app args)
        run: npm test --workspace glasspane-install
      - name: Build all TS workspaces (mcp-shell; the kernel is a published dependency)
        run: npm run build
      - name: Test all workspaces (mcp-shell + installer + updater)
        run: npm run test --workspaces --if-present

  # macOS 上的 Node 套件。这条 job 的存在理由是下面这个事实：`glasspane-update` 与
  # `glasspane-install` 的测试里有一族断言在非 macOS 主机上当场 `t.skip`
  # （`plutil is the reader being satisfied here` / `the control executes /bin/sh -c` 那一族，
  # 见 `updater/test/launchd.test.mjs`）。它们守的是这份**只在 macOS 上交付**的产品本身——
  # agent 拿到的是导出后的根 bundle、未转义的路径不能反过来改写 plist。上面那条 ubuntu
  # lane 保留（它的 `assert-test-count` 腿与跨平台形状是真话，skip 掉的那半也是它自己报出来的），
  # 但"这台机器上没有 launchd"不等于"这条断言通过了"。
  #
  # 写法上是**一整条 macOS job**，不是给 ubuntu job 加一步 `if: runner.os == 'macOS'`：
  # OS-gated 的一步在它不匹配的主机上等于没跑（本文件 `publish-gate-selftest` 那段写的就是这条
  # 规矩，fork 的 `installer-selftest` 同一处理）。在这张机器上这些用例是**测量**，不是跳过。
  #
  # 不跑 `npm run build`：这两个套件读的是源码与本仓已提交的产物，`install-gate` 里
  # `npm test --workspace glasspane-install` 本来就排在 build 之前跑，同一棵树。
  # 要跑的是 `npm ci`——根 lock 覆盖三个 workspace，与 `install-gate` 同一个 cache 口径。
  macos-node-gate:
    name: macOS node suites (updater + installer, the darwin-only assertions)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root
        run: npm ci
      - name: Test glasspane-update where launchd and plutil actually exist
        run: npm test --workspace glasspane-update
      - name: Test glasspane-install where the macOS paths are real
        run: npm test --workspace glasspane-install

  # 对外文档守卫：死链、失效锚点、双语成对（README/SECURITY/CONTRIBUTING 任一侧
  # 改名或漏翻译都在这里现形——面向陌生读者的文档，链接断了等于没交付）。
  docs:
    name: public docs (links, anchors, bilingual parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check links, anchors and bilingual pairing across public docs
        run: node scripts/check-doc-links.mjs

  # 版本线守卫：根 workspace / 两个 npm 包 / kernel / MCP 自报 / daemon 自报 /
  # .app bundle / install.sh 钉的 tag / lockfile 必须是同一个数字。漂移的后果不是
  # 难看而是危险：用户按 tag 装到的源码，和 registry 上的包、面板里显示的版本对不上。
  version-line:
    name: version line (single source of truth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every derived site agrees with root package.json
        run: node scripts/check-version.mjs

  # harness 尺子层守卫。这条 lane 的存在理由是一次真实事故：harness 的开发长期
  # 寄生在 worktree（gp-fork），收编进主仓时只带进了 fork 本体，harness/tools 与
  # harness/contracts 整体没进版本控制——而 FORK.md 把「分叉必须可测量」列为不可
  # 让步纪律并给出 4 条命令，其中 3 条在 main 上是 MODULE_NOT_FOUND。主仓 CI 里
  # `grep -c harness` 当时是 0，所以没有任何东西会发现这件事，直到发布出的安装器
  # 被人用。尺子必须和 fork 同仓（harness/README.md 开篇即此意），这条 lane 是
  # 「尺子丢了」这件事的报警器。
  #
  # 不装上游参照检出（.external/opencode，223 MB）：fork-diff 与 tool-surface 在
  # 没有参照时仍核我们这一侧，并如实打印「上游未在此观测」；hook-liveness 走
  # --offline，只做金样自洽并声明未观测上游。整包构建 >10 分钟且需要一张本机才有的
  # 拦截根证书，不进 CI——闸是按包的固定点测试 + 这几把尺子。
  harness-rulers:
    name: harness rulers (divergence, surfaces, branding, kernel provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 尺子自己不在仓里时，命令会以 MODULE_NOT_FOUND 失败——这正是要抓的形态，
      # 所以先断言它们在，再逐个跑。
      - name: The rulers are in the tree (the 2026-09-28 regression)
        run: |
          set -euo pipefail
          missing=0
          for f in fork-diff tool-surface brand-surface product-surface surface-semantics hook-liveness release-artifact; do
            if [ ! -f "harness/tools/$f.mjs" ]; then echo "::error::harness/tools/$f.mjs is missing from the tree"; missing=1; fi
          done
          for f in fork-diff tool-surface brand-surface surface-semantics hook-liveness; do
            if [ ! -f "harness/contracts/$f.json" ]; then echo "::error::harness/contracts/$f.json is missing from the tree"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "rulers present"

      # 上游参照检出（pinned tag，`--depth 1`，不进版本控制）。tool-surface 与
      # fork-diff 需要它做两件没有它就做不到的事：逐文件 blob 比对，以及识别
      # 「纯改名」。后者不是优化而是正确性：私有化把 63 个 locale 文件里的上游名
      # 换成本产品名，那是 2,700 行 find-and-replace 而非谁写的代码；没有参照检出
      # 就识别不出这些是 move，于是把它们算成我们的行，面 B 从 17% 虚报到 20%。
      # 该工具在没有参照时**故意**拒绝（"an unmeasured surface cannot be declared
      # within limits"），所以这里必须提供参照，而不是放宽它。
      - name: Fetch the pinned upstream reference clone (shallow)
        run: |
          set -euo pipefail
          tag="$(node -p "require('./harness/upstream.json').tag")"
          echo "pinning upstream at $tag"
          git clone --quiet --branch "$tag" --depth 1 https://github.com/anomalyco/opencode.git .external/opencode
          got="$(git -C .external/opencode describe --tags)"
          [ "$got" = "$tag" ] || { echo "::error::reference clone is at $got, not the pinned $tag"; exit 1; }

      - name: Divergence matches the recorded surface
        run: node harness/tools/fork-diff.mjs --check

      - name: Tool surfaces did not grow past the recorded baseline
        run: node harness/tools/tool-surface.mjs --check

      - name: Neither surface started judging evidence semantics
        run: node harness/tools/surface-semantics.mjs --check

      - name: No unrecorded brand drift
        run: node harness/tools/brand-surface.mjs --check

      - name: Product manifest, build, publish and installers agree
        run: node harness/tools/product-surface.mjs

      - name: Extension points are still live at the pinned upstream tag
        run: node harness/tools/hook-liveness.mjs --check

      # 发布物等于主干吗。`release.yml` 的 version-check 锚只在切 tag 那一刻比一次，所以
      # "主干又收了字节、发布物没有"这段窗口此前没有任何东西在量：2026-10-16 全 lane 绿的那棵树上
      # 实测攒出两个方向的分歧——74 行 SYNCLOG 收口补记只在主干（装的归档里没有本次发布的记录），
      # 以及一行 `draft=false` 只在发布物（主干把它吃掉了，照原样重切就会删掉发布仓里正确的字节）。
      # split main 要求严格相等：推一次搬运分支不消耗版本号，没有"回头再推"的正当性。tag 只允许
      # 落后于"本版自己的收口记录"这一种、且必须以 `△` 点名，其余一律红。
      - name: The released artifact and the split branch are trunk's bytes
        run: node harness/tools/release-artifact.mjs --check

      # 六把尺子今天各有一处"记录里写着、代码不读"的缺口（2026-10-19 审出）：补上的每条守卫
      # 都必须能红一次才算闸。这个电池对每条守卫改一个输入、跑真尺子、要求**具名**的诊断，
      # 再按 sha256 核回；它自己在改动前后都要求工作树干净，所以并行批次不会被它洗掉。
      # 写在 `harness/tools/` 里而 `product-surface` 的 selftest-wired 规则盯着它出现在某条
      # step 里——"测试写了但没人跑"正是这条 lane 存在理由的那次事故。
      - name: Each ruler guard can actually go red
        run: node harness/tools/rulers-selftest.mjs

      # 内核改依赖之后，出处检查要看得到装出来的那份包。第一次 CI 跑这段时它红了：
      # `kernel-pin: iterate-kernel is not installed — run 'bun install' …`，退出码 2。
      # 那不是回归而是这道闸的正确行为——测不到被测量物时它拒绝说绿。这里的修法是给它
      # 需要的安装，而不是放宽判据。bun 版本从 fork 自己的 packageManager 单点解析，
      # 不在这个文件里再写一个字面量（写了就会有"CI 装的 bun 与产品钉的不一样"这种账）。
      - name: "Resolve the pinned bun version (single source: the fork's packageManager)"
        id: bunver
        run: |
          set -euo pipefail
          pm="$(node -p "require('./harness/glasspane-harness/package.json').packageManager")"
          case "$pm" in
            bun@*) ;;
            *) echo "::error::packageManager is not a bun pin: $pm"; exit 1 ;;
          esac
          echo "version=${pm#bun@}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bunver.outputs.version }}

      - name: Install the fork workspace (frozen lockfile)
        working-directory: harness/glasspane-harness
        # `--ignore-scripts` because this job measures provenance and behaviour, not native
        # builds. Without it the install runs a dependency's node-gyp build
        # (`tree-sitter-powershell`) and that is exactly what turned red on the first run of
        # this step — the fork's own CI lane dodges the same rock by putting Node 24 first
        # (node-gyp@13 needs >=22), while this job pins Node 20 for the rulers. Skipping
        # lifecycle scripts also means this lane executes no third-party code, which is the
        # right posture for a job whose whole subject is "is this the artifact we recorded".
        # Verified against a clean `git archive` copy of the fork at this commit: 2920
        # packages installed, no gyp, and both `kernel-pin --check` (15 contract files) and
        # `kernel-conformance` (10 fixtures) pass on that tree — the kernel resolves from
        # `packages/opencode/node_modules`, which `kernel-pin.mjs` looks for explicitly.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: The installed bun is the pinned bun
        env:
          WANT_BUN: ${{ steps.bunver.outputs.version }}
        run: |
          set -euo pipefail
          got="$(bun --version)"
          if [ "$got" != "$WANT_BUN" ]; then
            echo "::error::bun $got on PATH, packageManager pins $WANT_BUN"
            exit 1
          fi
          echo "bun $got matches the pin"

      - name: The kernel dependency still matches its provenance manifest
        run: node harness/glasspane-harness/script/kernel-pin.mjs --check

      # 声明的补丁必须真的落进安装产物。2026-10-23 实测：`bun install` 把 @modelcontextprotocol/sdk
      # 1.31.0→1.32.0 的那条 patchedDependencies 从 bun.lock 里**静默删掉**——package.json 的声明还在，
      # 装上的 dist 里 _recoverSession / isRequestActive 全缺席，404 会话恢复、取消死请求、callTool
      # 重载（#20 逐 item 分类与场景①/⑤ 都踩在上面）整块没了，而类型检查读的是我们自己的 .d.ts、
      # 套件驱动的是假 transport，没有任何一环会红。这条读的就是安装字节本身。上面那步
      # `--ignore-scripts` 已实测**仍然**应用 patchedDependencies（删掉 store 重装后标记回来了），
      # 所以这条在此刻测量得了；它若回答"测不了"，退出码 2 就被下面那道 `rc -ne 0` 判红。
      - name: Every patch this fork declares is carried by the installed bytes
        run: node harness/glasspane-harness/script/patched-deps.mjs --check

      # 哈希只证明装到的是那一份；这条证明那份的行为还是我们依赖的那些答案——10 条
      # fixture 对着 contracts/kernel-conformance.json 的摘要与 fixture 自带的期望跑。
      - name: Kernel behaviour answers as recorded (fixtures through the installed kernel)
        working-directory: harness/glasspane-harness
        run: bun script/kernel-conformance.mjs

      # 下面两把尺子的**自测**：写好了却没有任何 lane 跑过它们（grep 全仓：既不在 workflow 里，
      # 也不在 package.json 的脚本里，第三把住在下面那条 macOS job）。这正是本条 lane 开篇记的那次
      # 事故的同一种形状——尺子在树里、判据没人执行，于是"有测试"这件事本身成了假绿。两步都跑在
      # 参照检出与 bun 安装**之后**：这条 job 到这一步已经测量得了，所以它们若回答"测不了"，那条
      # 回答在这就是缺陷，不是豁免。两条自测现在都对"测不了"回 exit 2（2026-10-16 落地的分码：
      # 0 通过 / 1 判决不成立 / 2 测不了），退出码那一道闸就把它判红；正文那道 `case` 是第二张网，
      # 防的是有人把它改回"静默 exit 0"。
      - name: "The batch reader answers with git show's bytes (ref-batch selftest)"
        run: |
          set -euo pipefail
          rc=0
          out="$(node harness/tools/ref-batch-selftest.mjs 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::ref-batch 的固定点测试以 exit $rc 失败（上面点名的是哪条断言）。remedy：面 B 的读数就是从它验的批量读来的——先修 harness/tools/ref-batch.mjs，别放宽测试的期望；contracts/tool-surface.json 要在修好之后重录。"
            exit 1
          fi
          # 匹配用 case 不用 `printf | grep -q`：这个 shell 开了 pipefail，而 grep -q 命中就走，
          # printf 随后死在 SIGPIPE 上，管道的退出码就成了 141 —— 一道会把自己判成"没跳过"的跳过闸，
          # 与 release.yml 里 `npm pack --silent | tail -1` 那次记的是同一个坑。
          case "$out" in
            *"NOT self-tested"*|*"not exercised"*)
              echo "::error::ref-batch selftest 以 exit 0 回答了「没测量」。这条 job 在上面已经取到参照检出（.external/opencode），所以此刻没有任何东西阻止它测量——闸没合上就是红的。remedy：查上面那步 clone 是否成功、harness/upstream.json 的 fork.referenceClone 是否还指对。"
              exit 1 ;;
          esac
          echo "ref-batch selftest 已测量：批量读与 git show 逐字节一致"

      - name: "The kernel provenance gate can still go red (kernel-pin selftest)"
        run: |
          set -euo pipefail
          rc=0
          out="$(node harness/tools/kernel-pin-selftest.mjs 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::kernel-pin 的自测以 exit $rc 失败。这个文件证明的是**每条红都点名真正的分歧侧**——上面那条 FAIL 说哪条判决退化成了通用文本或干脆不红。remedy：按它点名的那条修 harness/glasspane-harness/script/kernel-pin.mjs 的判决分支；这条闸的红必须能对上号，否则一次误诊就会把金样重录到错的产物上。"
            exit 1
          fi
          # 这个自测没有「测不了」分支：它只造临时产物根、跑真脚本，要么给出判决要么非 0 退出，
          # 所以上面那条退出码就是全部的闸。别的 lane 若给它加上 exit 2，这里同样是红——退出码
          # 非 0 已经把它接住了，不需要猜它会打印什么。
          echo "kernel-pin selftest 已测量：每条红都因为它点名的那个原因红"

      # 上面那条补丁闸自己能不能红、且各条红的原因不同？它比的是三方：package.json 的声明、bun.lock
      # 的 patchedDependencies、安装产物里补丁新增的行。三方任一侧单独动一下必须是不同的判决文本，
      # 否则一次误诊就会把「补丁没应用」说成「包没装」，而这两种处置相反。这条自测用真 git diff 造
      # 补丁（不是手抄一份来迎合自己的解析器），11 组夹具、28 条断言，含两条**反过度反应**的用例：
      # 不在图里的声明、以及被覆盖版本旁边多出来的未覆盖版本，都必须绿并只打 `△`——把它们判红，这把
      # 尺子一周内就会被放宽掉。
      - name: "The patch-integrity gate can still go red, for each reason separately (patched-deps selftest)"
        run: |
          set -euo pipefail
          rc=0
          out="$(node harness/tools/patched-deps-selftest.mjs 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::patched-deps 的固定点测试以 exit $rc 失败。上面 FAIL 的那条点名的是哪个判决退化成了通用文本、或干脆不红。remedy：按它点名的那条修 harness/glasspane-harness/script/patched-deps.mjs 的分流，别改期望值——这条闸存在的唯一理由，就是「声明了却没装上」此前在这棵树里没有任何东西看得见。"
            exit 1
          fi
          case "$out" in
            *"assertion(s) FAILED"*)
              echo "::error::patched-deps selftest 以 exit 0 回答了「有断言失败」——它把自己的失败吞成了绿。remedy：查它末尾的 process.exit 是否还跟着 failures 计数。"
              exit 1 ;;
          esac
          echo "patched-deps selftest 已测量：每条红都因为它点名的那个原因红"

      # 上面那条锚闸自己能不能红？它比的是两个远端 ref 的 tree 哈希，而"取不到远端"和"取到了但
      # 不等"这两种回答必须不同——否则一次网络抖动就会把它变成常绿的装饰。这条自测用 file:// 上的
      # 真仓库（真 commit、真 annotated tag）把两条规则分别打到绿/红，包括两个"一条绿一条红"的
      # 形状：把 74 行只在主干、和一行只在发布物，合成一个"树不等"就看不出区别，而这两种的处置
      # 完全相反（前者补一次切版，后者必须先把字找回主干再重切）。
      - name: "The release-artifact anchor can still go red, for each reason separately"
        run: |
          set -euo pipefail
          rc=0
          out="$(node harness/tools/release-artifact-selftest.mjs 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::release-artifact 的固定点测试以 exit $rc 失败（上面 FAIL 点名的是哪一条电池）。remedy：先修 harness/tools/release-artifact.mjs 那条被点名的判决，别改期望值；两条规则必须能各自独立变红，否则这条锚分不清「发布物缺字节」与「主干丢字节」。"
            exit 1
          fi
          case "$out" in
            *"NOT self-tested"*)
              echo "::error::release-artifact selftest 回答了「没测量」。这条 job 有 git 与 node，此刻没有任何东西阻止它建夹具——闸没合上就是红的。remedy：查 runner 上 git 是否可用，别把它改成 exit 0。"
              exit 1 ;;
          esac
          echo "release-artifact selftest 已测量：每条规则都因它点名的那个原因变红"

  # 第三把没人跑的自测不能住在上面那条 job 里：`verify-published-selftest.sh` 跑的是真正的发布闸
  # (`packages/opencode/script/verify-published.ts`)，而那把闸在非 macOS 主机上当场 exit 2
  # "host is linux; this product is macOS-only and NOTHING was verified"。把它塞进 ubuntu 的
  # harness-rulers，得到的只能是"因主机选错而红"——和它要防的"因产物坏而红"完全是两回事，红久了
  # 就没人看。而 `if: runner.os == 'macOS'` 那种写法等于没跑（本仓明令禁止，见 fork 的 ci.yml 里
  # installer-selftest 的同一处理）。所以它自成一条 macOS job：在这张机器上它是**测量**，不是跳过。
  # 依赖只到 bun + node：发布闸 import 的只有 `bun`、`node:*` 与../../../product.json，不需要
  # workspace 安装，所以这条 job 不跑 `bun install`。
  publish-gate-selftest:
    name: publish gate selftest (verify-published, macOS-only product)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Resolve the pinned bun version (single source: the fork's packageManager)"
        id: bunver
        run: |
          set -euo pipefail
          pm="$(node -p "require('./harness/glasspane-harness/package.json').packageManager")"
          case "$pm" in
            bun@*) ;;
            *) echo "::error::packageManager is not a bun pin: $pm"; exit 1 ;;
          esac
          echo "version=${pm#bun@}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bunver.outputs.version }}

      - name: "The publish gate gives three different answers (verify-published selftest)"
        # bash 而非 sh：这个文件用 `set -uo pipefail`，而 /bin/sh 在 GitHub 的 ubuntu runner 上是
        # dash（没有 -o pipefail）；macOS 的 /bin/sh 是 bash 的 posix 模式，但这条 job 不该靠那张
        # 机器的巧合来决定测不测得成。
        run: |
          set -euo pipefail
          rc=0
          out="$(bash harness/tools/verify-published-selftest.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::verify-published 的固定点测试以 exit $rc 失败。它拿三个假前缀把发布闸的三条分支各跑一遍（good / 错误页 / 永不 listening）。remedy：红的那条分支名在上面的 FAIL 里——判据若退化成套一句 /\<html/i 就再也看不见错误页，那是这检查历史上真实存在过的形状；修 harness/glasspane-harness/packages/opencode/script/verify-published.ts 的判决，别改期望。退 2 的另一读法：bun 或 node 没在这条 job 里装上，那同样是红（测不了不是过）。"
            exit 1
          fi
          # 退出码之外再看正文：这个文件对"跑不了"的回答以前是 `SKIP … was NOT exercised` + exit 0
          # （另一条 lane 正在把它改成 exit 2）。两种形态在这里都是红——一道只能回答"没测"的闸
          # 不构成发布链的绿灯。匹配用 case 不用 `printf | grep -q`：pipefail 配上提前退出的 grep
          # 会把"我跳过了"读成"我没跳过"（与本文件 114 行那条 npm pack 的坑同源）。
          case "$out" in
            *"NOT exercised"*)
              echo "::error::verify-published selftest 以 exit 0 回答了「没跑成」。这条 job 有钉死的 bun 与 setup-node 的 node，此刻拒绝测量就是缺陷而不是环境限制。remedy：查上面 setup-bun 那步的输出。"
              exit 1 ;;
          esac
          echo "verify-published selftest 已测量：三种情形给出三个不同的答案"

  # 工作流可编译性守卫。GitHub 拒绝解析的工作流不产生任何 job 日志：它在解析期整体
  # 作废，之后每次触发只留下一个 0 步、名为文件路径的红色 run。c3797d4 用
  # `if: ${{ secrets.X != '' }}`（secrets 不是 step if 的合法 context）把 Release 链
  # 锁死，main 上连着六次 push 只表现为"又一个看不懂的红灯"，签名步骤因此从未跑过。
  # 这条守卫的意义不是"少一步"而是"整条链还在不在"。
  workflow-lint:
    name: GitHub Actions workflows compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject workflow files GitHub would refuse to load
        run: |
          node scripts/check-workflows.mjs --self-test
          node scripts/check-workflows.mjs