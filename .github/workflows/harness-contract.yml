name: Harness contract (upstream opencode)

# 这条 lane 的唯一职责：在**上游发布**时回答"升级会不会把我们脚下的插件地板换掉"，
# 并在答"会"的时候让升级冻结（红）。工具面 B 的契约测试纪律（综述 §8.2 / R34）
# 全靠这一条才从纸面变成机制——见 specs/GlassPane_Harness_Fork_调研与方案_v0.1.md §6.2。
#
# 不在 PR CI 里跑：它要下载上游 tarball（~142 MB），且失败与本次提交无关。
# PR CI 只跑离线自洽（见 ci.yml 的 install-gate）。

on:
  schedule:
    - cron: "17 6 * * 1" # 每周一 06:17 UTC：上游约每周 1–2 次发布，这个频率够早也不会和发布日同频
  workflow_dispatch:
    inputs:
      probe_tag:
        description: "要探查的上游 tag（留空＝上游最新 release）"
        required: false
        default: ""
  push:
    paths:
      - "harness/**"
      - ".github/workflows/harness-contract.yml"

permissions:
  contents: read

# 两条 job 都带 `timeout-minutes`（2026-10-24 复核 D5：原来一条没有，默认 6 小时）。数值取自
# 这条 lane 最近几次 run 的 job 实测耗时（`gh api …/actions/runs/<id>/jobs`：contract 15–23s、
# kernel-drift 7–22s），但这条 lane 的耗时下限由**网络**决定——它要拉 142 MB 的上游 tarball 与
# 一次 registry 查询，所以给的是"慢十倍仍然过"的额度，不是"跑得快"的额度。
jobs:
  contract:
    name: hook-liveness vs upstream (${{ matrix.purpose }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        purpose: [pinned, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve upstream tag
        id: tag
        env:
          PURPOSE: ${{ matrix.purpose }}
          PROBE_TAG: ${{ github.event.inputs.probe_tag }}
          # `gh` 在这条 step 里读的是**别人的**公开仓，但用的仍是本 job 的凭据；D6-c 的规矩是
          # "调 gh 的 step 必须自己声明 GH_TOKEN"，而不是靠镜像里恰好有哪个环境变量。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned="$(node -p "require('./harness/upstream.json').tag")"
          if [ "$PURPOSE" = "pinned" ]; then
            echo "tag=$pinned" >> "$GITHUB_OUTPUT"
            echo "checkout_dir=$RUNNER_TEMP/upstream-pinned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resolved=""
          if [ -n "${PROBE_TAG:-}" ]; then
            resolved="$PROBE_TAG"
          else
            # 这一问必须先问得出**为什么问不出**。原先它是一条不分用户的
            # `curl -fsSL … | node -e 'JSON.parse(s).tag_name'`：共享 runner 的出口 IP 上匿名限额
            # 60 req/hr 常被别的仓打满，`curl -f` 遇到 403 什么也不写，于是 node 死在
            # "Unexpected end of JSON input" 的堆栈上（实测于 2026-10-26 的一次 push，
            # run 40264853002：`curl: (22) … error: 403` 紧跟一段 Node 栈）。那条红与
            # "上游换了插件地板"长得一模一样，而这条 lane 的红的**唯一含义**就是后者——
            # 与 verify-published.ts 里 `cannotObserve` 记过的同一种失效：会喊狼的闸最后被人关掉。
            #
            # 顺序：先认证（`gh api` 用 job 自带的 GITHUB_TOKEN，跨公开仓读 release 够用），
            # 再匿名兜底，且兜底那条**先取 HTTP 状态**，绝不再把空串喂给 JSON 解析器。
            if answer="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name 2>/dev/null || true)" && [ -n "$answer" ]; then
              resolved="$answer"
              echo "resolved from api.github.com with the job credential: $resolved"
            else
              # 状态码取最后一行。**注意**为什么不用 `${body##*$(printf '\n')}`：命令替换会把结尾的
              # 换行剥掉，于是那个"换行"是空串，模式变成 `##*` ——整个 body 被吃掉、status 恒空，
              # 每一次"问不出"都会说成 `HTTP none`，而真正该区分的是 403 与 200-but-empty。
              # 第一版就是这么写的，被电池的 C 用例（匿名 curl 回 200 + 合法 body）当场抓出来：
              # 本该走通的兜底路径被判成了"问不出"。
              body="$(curl -sS -w '\n%{http_code}' https://api.github.com/repos/anomalyco/opencode/releases/latest || true)"
              status="$(printf '%s' "$body" | tail -n 1)"
              payload="$(printf '%s' "$body" | sed '$d')"
              if [ "$status" = "200" ]; then
                resolved="$(printf '%s' "$payload" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.tag_name??"")})' || true)"
              fi
              if [ -z "${resolved:-}" ]; then
                echo "::error title=上游最新 tag 问不出（这不等于漂移）::api.github.com 回 HTTP ${status:-none}，两条通道都没给出 tag_name（匿名限额按出口 IP 计，共享 runner 上 403 是常态）。这条 lane 的唯一职责是回答"上游有没有换插件地板"；这一跑没问到 tag，所以既不构成漂移、也不构成「没有漂移」。"
                {
                  echo "### 上游探查：未观测（NOT OBSERVED）"
                  echo ""
                  echo "HTTP \`${status:-none}\`（\`gh api\` 与匿名 curl 都没给出 tag_name）。**漂移问题没有被回答**，这条红的含义是"测量失败"，不是"上游坏了"。"
                  echo ""
                  echo "补救：确认 job 能读到 \`secrets.GITHUB_TOKEN\`（或给这条 step 一个对公开 API 有配额的 fine-grained token），再用 \`workflow_dispatch\` 带上 \`probe_tag\` 重跑一次。"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "resolved from the anonymous fallback: $resolved"
            fi
          fi
          # 手动输入的 tag 会进 curl URL 与摘要文本：先钳成 release tag 的形状，
          # 不给它任何成为 shell 片段或 ref 注入的机会。
          # 判据走 here-string 而不是 `printf | grep -q`：这条正文现在带 pipefail，而
          # `grep -q` 命中即退出，printf 随后死在 SIGPIPE 上——管道状态成了 141，`if !` 把它读成
          # "形状不合法"，一个**合法**的 probe_tag 会被自己这道闸拒掉。同一个坑本仓已经记过两次
          # （ci.yml 的 `npm pack | tail`、release.yml 的 `case` 换掉 `printf | grep -q`）。
          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$resolved"; then
            echo "::error title=probe_tag 形状不合法::期望 vMAJOR.MINOR.PATCH，收到 '$resolved'（未执行任何下载）。"
            exit 1
          fi
          echo "tag=$resolved" >> "$GITHUB_OUTPUT"
          echo "checkout_dir=$RUNNER_TEMP/upstream-latest" >> "$GITHUB_OUTPUT"

      - name: Skip when latest equals the pin (nothing to probe)
        id: skip
        env:
          PURPOSE: ${{ matrix.purpose }}
          RESOLVED: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # D6 点名的就是这一步：从前它一行闸门都没有。`RESOLVED` 来自上面那步的 output，
          # 那步没跑成时它是空的，`[ "$RESOLVED" = "$pinned" ]` 于是判成"不相等"→ 继续往下走，
          # 而 `node -p` 自己失败时（upstream.json 读不到）正文里的 `$( )` 返回空串加一条 stderr，
          # 整步照样退 0。默认 shell 的 `-e` 管不到"命令答了个空串"，也管不到管道中间那一段。
          pinned="$(node -p "require('./harness/upstream.json').tag")"
          if [ "$PURPOSE" = "latest" ] && [ "$RESOLVED" = "$pinned" ]; then
            echo "上游最新 release 就是 pin（$pinned）——没有新版本可探查，跳过。" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream at the resolved tag
        if: steps.skip.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIR: ${{ steps.tag.outputs.checkout_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          curl -fsSL -o "$DIR/oc.tgz" "https://codeload.github.com/anomalyco/opencode/tar.gz/refs/tags/$TAG"
          tar xzf "$DIR/oc.tgz" -C "$DIR" --strip-components=1
          rm -f "$DIR/oc.tgz"
          node -p "'fetched ' + require('$DIR/packages/opencode/package.json').version + ' into ' + '$DIR'"

      - name: Pinned base must still match the golden
        if: matrix.purpose == 'pinned' && steps.skip.outputs.skip == 'false'
        env:
          HARNESS_UPSTREAM_CHECKOUT: ${{ steps.tag.outputs.checkout_dir }}
        run: node harness/tools/hook-liveness.mjs --check

      - name: Probe a newer upstream release (drift = freeze the upgrade)
        if: matrix.purpose == 'latest' && steps.skip.outputs.skip == 'false'
        env:
          HARNESS_UPSTREAM_CHECKOUT: ${{ steps.tag.outputs.checkout_dir }}
          PROBED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          pinned="$(node -p "require('./harness/upstream.json').tag")"
          # The verdict is the tool's exit code, not the presence of a word in its output.
          # This used to be `out="$(… || true)"` followed by `grep -q "drift"`, which made
          # the lane unable to fail: --probe answers 1 for drift, 2 for "cannot measure"
          # (no checkout at $HARNESS_UPSTREAM_CHECKOUT, unreadable golden, thrown error),
          # and none of those exit-2 messages contain the string "drift" — so a probe that
          # never ran printed its own failure and went green. "没有漂移" and "上游没被观测"
          # are different claims and must not be purchasable with the same word.
          rc=0
          out="$(node harness/tools/hook-liveness.mjs --probe 2>&1)" || rc=$?
          printf '%s\n' "$out"
          {
            echo "### 上游探查 $pinned → $PROBED_TAG (exit $rc)"
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "probe clean: $PROBED_TAG keeps the plugin surface"
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::error title=上游换了插件地板::hook-liveness 在 $PROBED_TAG 上漂移。按综述 R34 归因＝上游坏：冻结升级，不要在本仓打补丁绕过。"
            exit 1
          fi
          echo "::error title=上游探查没有跑成（这不等于没有漂移）::--probe 以 exit $rc 拒绝测量（\$HARNESS_UPSTREAM_CHECKOUT 指向的检出缺失或不可读）。这条 lane 唯一的职责就是回答上游有没有换地板，测不了必须红，不能绿。"
          {
            echo ""
            echo "**未观测**：探查没有测量到任何东西（exit $rc）。这不构成「上游没漂移」。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Offline self-consistency (always, cheap)
        if: matrix.purpose == 'pinned'
        run: |
          set -euo pipefail
          node harness/tools/hook-liveness.mjs --offline
          node -e "const j=require('./harness/contracts/hook-liveness.json');const dead=j.hooks.filter(h=>h.kind==='dead').map(h=>h.name);console.log('known dead hooks:', JSON.stringify(dead));if(!(dead.length===1&&dead[0]==='permission.ask')){console.error('金样的死钩子集与调研结论不符');process.exit(1)}"
          # 这条 lane 自己的判决逻辑也在闸面上：探针改为吃 exit 码之后，"测不了"必须还能
          # 把 step 判红。这个自测从下面那段真 run 正文里抽代码跑三种退出码，所以改了
          # 判决就会咬，不需要谁记得来手动验。
          sh harness/tools/probe-lane-selftest.sh

  # The shared kernel lives in another repository, pinned by ref. Asking "has it moved,
  # and can we still ask the question?" on the same weekly schedule as the upstream probe
  # is what keeps "one kernel, N consumers" a fact rather than a hope.
  #
  # The contract this job enforces is `kernel-pin.mjs --probe`'s exit code, and the two halves
  # mean different things. exit 0 = it MEASURED, and a measurement may say DRIFT: drift stays
  # green by design, because the vendored bytes are still exactly what the manifest declares
  # (`--check` proves that in the normal lane) and taking the kernel's move is a human decision,
  # not a red build. exit != 0 = it COULD NOT ASK (registry unreachable, the package answered
  # nothing, the script threw), and that is red: an unanswered question may not be filed as
  # "no drift", which is the same shape as the upstream probe lane's defect further up this file.
  # It used to be that `--probe` exited 0 for "could not ask" while this comment claimed the job
  # "fails when the anchor is unreachable" — the claim was the intent, and the code below is what
  # makes it the behaviour too. The answer itself now has a reader: it goes into the run summary,
  # because a weekly probe whose output nobody opens is indistinguishable from one that never ran.
  kernel-drift:
    name: kernel drift probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "canonical kernel: moved? anchor still reachable?"
        run: |
          set -euo pipefail
          rc=0
          out="$(node harness/glasspane-harness/script/kernel-pin.mjs --probe 2>&1)" || rc=$?
          printf '%s\n' "$out"
          {
            echo "### 内核探查（exit $rc）"
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=内核漂移没有被测量（这不等于没有漂移）::--probe 以 exit $rc 拒绝回答：注册表问不到，或它答不出。这条 lane 唯一的职责就是回答共享内核有没有换版本，测不了必须红。检查 npm 是否能访问 registry（npm view iterate-kernel version），修好后重跑这一条 lane。"
            {
              echo ""
              echo "**未观测**：探查没有测量到任何东西（exit $rc）。这不构成「内核没漂移」。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Drift is a finding for a human, not a CI red: `--check` in the normal lane already
          # proves the bytes we ship are the bytes the manifest declares, so a moved upstream
          # version is a decision to take, and deciding it is the kernel's owner's call. The order
          # to take it is in the probe's own answer (bump the dependency line, install, re-record
          # the manifest in the fork root, re-run the conformance fixtures). Matching with `case`
          # rather than a piped `grep -q` because pipefail + an early-exiting grep turns a hit into
          # a SIGPIPE status — the same trap this repository already documented for `npm pack`.
          case "$out" in
            *"DRIFTED"*)
              echo "::notice title=共享内核换了版本（红不是这一条的判决）::--probe 测到了漂移，答案已写进 run summary。"
              ;;
          esac
