name: CI

# The product's functional lane: it can install, typecheck and run the fixed-point
# tests on the packages we actually ship (CLI + TUI + SDK + plugin). The strict
# harness gates (hook-liveness / fork-diff / kernel-pin / tool-surface /
# surface-semantics / product-surface / brand-surface) live one level up in the
# GlassPane repo's `harness/` — that is where the fork is developed, and the
# split repo is a distribution of its results, not a second source of truth.
#
# Deliberately NOT here: any publish/deploy job. Upstream's 26 workflows are
# gone (they pushed to anomalyco/* infrastructure and published opencode
# packages); distribution is release.yml's single story, on our own credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, typecheck, fixed points
    runs-on: ubuntu-latest
    # Ceiling, not a guess: the slowest thing here is `bun install` (4,671 packages) followed by
    # four per-package typechecks and the fixed-point suites. 40 is above the worst measured run;
    # the point of naming one at all is that GitHub's default is 360, so a hung runner holds the
    # `ci-${{ github.ref }}` concurrency slot for six hours before anything reports it.
    timeout-minutes: 40
    steps:
      # Every `actions/*` ref in this subtree's workflows is pinned to a 40-hex SHA, and
      # `scripts/check-workflows.mjs` now enforces pins for this root too (it used to exempt the
      # fork subtree). The split repository is the thing that actually publishes, so a retagged
      # `@v4` here is attacker code in the release chain, not just in a read-only lane.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-bun

      # This repository's own two workflows, checked by a rule that lives in this tree. The parent
      # repository scans them too but answers with a `△` advisory — "reported to that root's own
      # gate, not enforced from here" — and until this step existed, that root had no gate: the
      # advisory was addressed to nobody, and the split repo that actually runs these jobs (and
      # holds the publishing credentials) never asked. Cheapest lane in the job, so it runs first:
      # a workflow defect should cost seconds, not a `bun install` of 4,671 packages.
      - name: This repository's workflows meet its own rules
        run: node script/check-workflows.mjs

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Typecheck the shipped packages
        run: |
          set -euo pipefail
          for pkg in opencode tui sdk/js plugin; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && bun run typecheck)
            echo "::endgroup::"
          done

      - name: Fixed-point tests (glasspane tool surface, ledger, compaction, rendering)
        working-directory: packages/opencode
        # This step used to be a hand-written list of nine paths in a monorepo that carries
        # eighteen fixed-point files. The nine it named were the nine written earliest, so every
        # file added after them ran nowhere — and the hole is not "untested" but "unfailing":
        # `test/server/auth.test.ts` had a red assertion for it the whole time and no lane ever
        # read it. The list is now derived from the directories our fixed points live in, so a new
        # file is picked up by the glob instead of by someone remembering to edit YAML.
        # The floor is the other half: a glob that stops matching expands to nothing, `bun test`
        # with no paths runs the whole package (upstream's timing-sensitive suite, which is why
        # this lane names files at all), and neither of those is a red. So count first.
        run: |
          set -euo pipefail
          files=(
            test/tool/glasspane-*.test.ts
            test/plugin/glasspane-*.test.ts
            test/script/*.test.ts
            test/config/glasspane-*.test.ts
            test/server/auth.test.ts
          )
          missing=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::$f matched nothing — a fixed-point directory moved or its files were renamed"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "fixed-point files: ${#files[@]}"
          if [ "${#files[@]}" -lt 18 ]; then
            echo "::error::the derived list resolved to ${#files[@]} file(s); this package carries 18 fixed-point files, so a pattern went dead rather than the count dropping honestly"
            exit 1
          fi
          bun test --timeout 30000 "${files[@]}"

      # The rule that keeps this fork from publishing into someone else's npm scope lives in
      # `harness/tools/product-surface.mjs`, which is in the parent repository and therefore NOT
      # in this tree — the repository that actually publishes had no copy of the guarantee. This
      # step is the behavioral form of it: every dead-end publisher is run, and each must refuse
      # with exit 2. A byte-scan can be satisfied by a comment; running the file cannot.
      - name: Dead-end publishers still refuse (exit 2 before they can reach a registry)
        run: |
          set -euo pipefail
          refused=0
          for rel in script/publish.ts packages/cli/script/publish.ts packages/plugin/script/publish.ts packages/sdk/js/script/publish.ts packages/ui/script/publish.ts; do
            if [ ! -f "$rel" ]; then
              echo "::error::$rel is gone — the publisher list moved, and the refusal cannot be assumed about a file nobody looked at"
              exit 1
            fi
            # errexit off for the run, on again after: the refusal IS a non-zero exit, and a
            # `|| true` on the assignment would erase the number this step exists to read.
            set +e
            out="$(bun run "$rel" 2>&1)"
            code=$?
            set -e
            if [ "$code" = "0" ]; then
              echo "::error::$rel exited 0 — a publisher that does not refuse is a publisher that publishes"
              echo "$out"
              exit 1
            fi
            if [ "$code" != "2" ] && ! printf '%s' "$out" | grep -qiE "refus|does not ship|not this product|does not publish"; then
              echo "::error::$rel exited $code without naming a refusal — that is a crash, not a gate"
              echo "$out"
              exit 1
            fi
            if printf '%s' "$out" | grep -qE "npm notice|Publishing to|\+ @opencode"; then
              echo "::error::$rel looked like it published something"
              exit 1
            fi
            refused=$((refused + 1))
            echo "ok: $rel refuses (exit $code)"
          done
          if [ "$refused" -eq 0 ]; then
            echo "::error::no publisher was checked — the loop matched nothing"
            exit 1
          fi
          echo "checked $refused dead-end publisher(s)"

      - name: TUI rendering fixed points
        working-directory: packages/tui
        run: bun test --timeout 30000 test/cli/tui/inline-tool-wrap-snapshot.test.tsx

      # Pack the WRAPPER and validate its shape (bins present and executable, the
      # optionalDependencies == product.json target matrix, the os/cpu gate) without
      # touching the registry. Scope honest note: this lane builds nothing, so dist/ is
      # absent and the two platform tarballs are NOT packed or checked here — publish.ts
      # says so out loud ("no ./dist here — validating the wrapper only"). The platform
      # shape is checked in release.yml's binaries lane, where each runner builds its own
      # target and then runs the same validator over it. Calling this "every artifact" was
      # a claim a green PR could not support.
      - name: npm pack validation (no registry access)
        working-directory: packages/opencode
        run: bun run script/publish.ts --dry-run

      # 出处：装进来的 iterate-kernel 必须还是 kernel-pin.json 记下的那个版本、那条
      # lock 完整性、以及随包契约文件的逐文件 sha256（清单里有几条就验几条，`--check` 打条数；
      # 2026-10-13 实测 26 条 = 18 fixtures + 8 schemas）。语义内核换了字
      # 节而不重录，就是"我们悄悄改了共享契约"。vendored 那棵树已经退役——内核现在是
      # 依赖，不是我们抄进仓里的源码。
      - name: Kernel provenance (installed version + lock integrity + shipped corpus)
        run: node script/kernel-pin.mjs --check

      # 行为：把随包发出的 fixtures 跑过**装进来的那份内核**。哈希只证明字节没变；这条
      # 证明我们依赖的那些答案还是那些答案。要证明"换的只是分发方式"，本地加
      # --impl <canonical kernel checkout> 跑一次即可（两条 zod major 同答案是实测过的）。
      - name: Kernel conformance (shipped corpus through the installed kernel)
        run: bun script/kernel-conformance.mjs

      - name: Product manifest agrees with the package it ships
        run: |
          node -e '
            const fs = require("fs")
            const product = JSON.parse(fs.readFileSync("product.json", "utf8"))
            const pkg = JSON.parse(fs.readFileSync("packages/opencode/package.json", "utf8"))
            const problems = []
            if (pkg.name !== product.name) problems.push(`package name ${pkg.name} != product ${product.name}`)
            if (pkg.version !== product.version) problems.push(`package version ${pkg.version} != product ${product.version}`)
            for (const bin of product.bins) if (!pkg.bin?.[bin]) problems.push(`bin ${bin} missing from package.json`)
            if (problems.length) { console.error("product.json and packages/opencode/package.json disagree:"); for (const p of problems) console.error(" -", p); process.exit(1) }
            console.log("product manifest OK:", product.name, product.version, "bins:", product.bins.join(", "))
          '

  # installer-selftest.sh 是 scripts/install.sh 回退通道（GitHub release asset + sha256/GPG）
  # 的离线行为测试：stub curl/uname/npm/gpg，175 条具名断言（2026-10-26 实测，脚本自己打数——
  # 收尾行是 `installer-selftest: all 175 checks held`；2026-10-19 记的是 165，2026-10-14 是 80）。
  # 数在这里是为了让"某一段静默不跑了"看得见；真源是脚本自己数的那条，不是这句注释。在此之前
  # 没有任何 lane 运行它——grep 全仓只能找到 README/CHANGELOG/contracts，这正是本文件
  # 存在要防的失败形态（测试写而无人跑）。
  # 为什么单独成 job 而不是 verify 的一步：selftest 有意把 `uname -s` 留给真机（macOS-only
  # 拒绝就是这个 installer 的行为契约的一部分），所以它只能在 macOS 上绿；在 ubuntu 上
  # 每一步都会红。用 `if: runner.os == 'macOS'` 跳过等于没跑——本仓库明令禁止那种修法。
  installer-selftest:
    name: install.sh fallback channel (offline, stubbed)
    runs-on: macos-14
    # The lane is stubbed and offline: measured 17.01s wall for 175 named checks on this machine (re-timed after the lane was final; an earlier 15.42s reading was taken while two checks were failing, i.e. before the work finished — a fast selftest is not automatically a correct one)
    # (`/usr/bin/time -p bash packages/opencode/script/installer-selftest.sh`). 20 minutes is that
    # number with room for a loaded runner — and naming any ceiling at all is the point, because
    # the default is 360 and this job runs on a macOS runner, the scarcest label here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer selftest (stubbed curl/npm/gpg; the script prints its own check count)
        run: bash packages/opencode/script/installer-selftest.sh
