name: CI

# The product's functional lane: it can install, typecheck and run the fixed-point
# tests on the packages we actually ship (CLI + TUI + SDK + plugin). The strict
# harness gates (hook-liveness / fork-diff / kernel-vendor / tool-surface /
# surface-semantics / product-surface / brand-surface) live one level up in the
# GlassPane repo's `harness/` — that is where the fork is developed, and the
# split repo is a distribution of its results, not a second source of truth.
#
# Deliberately NOT here: any publish/deploy job. Upstream's 26 workflows are
# gone (they pushed to anomalyco/* infrastructure and published opencode
# packages); distribution is release.yml's single story, on our own credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, typecheck, fixed points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace
        run: bun install

      - name: Typecheck the shipped packages
        run: |
          for pkg in opencode tui sdk/js plugin; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && bun run typecheck)
            echo "::endgroup::"
          done

      - name: Fixed-point tests (glasspane tool surface, ledger, compaction, rendering)
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/tool/glasspane-surface.test.ts test/tool/glasspane-kernel.test.ts test/plugin/glasspane-decision-log.test.ts test/plugin/glasspane-compaction.test.ts

      - name: TUI rendering fixed points
        working-directory: packages/tui
        run: bun test --timeout 30000 test/cli/tui/inline-tool-wrap-snapshot.test.tsx

      # Pack every npm artifact and validate its shape (bins present and executable,
      # wrapper's optionalDependencies == product.json's target matrix, os/cpu gate)
      # without touching the registry. A package that installs but cannot run is the
      # failure mode this catches on a PR instead of after a release.
      - name: npm pack validation (no registry access)
        working-directory: packages/opencode
        run: bun run script/publish.ts --dry-run

      # 出处：随包发出的 vendored 内核，以及镜像下来的契约 fixtures，都必须还是
      # kernel-vendor.json 里记下的那些字节。改了任何一个而不重录，就是"我们悄悄
      # 改了自己的语义内核"。
      - name: Kernel provenance (vendored bytes + mirrored fixtures)
        run: node script/kernel-vendor.mjs --check

      # 行为：把 fixtures 跑过**我们随包发出的那份源码**。哈希只证明字节没变；这条
      # 证明我们依赖的那些答案还是那些答案。将来若把 vendored 换成 npm 依赖，加
      # --impl <已安装的包目录> 就是那条证明"换的只是分发方式"的证据。
      - name: Kernel conformance (mirrored fixtures through the shipped kernel)
        run: bun script/kernel-conformance.mjs

      - name: Product manifest agrees with the package it ships
        run: |
          node -e '
            const fs = require("fs")
            const product = JSON.parse(fs.readFileSync("product.json", "utf8"))
            const pkg = JSON.parse(fs.readFileSync("packages/opencode/package.json", "utf8"))
            const problems = []
            if (pkg.name !== product.name) problems.push(`package name ${pkg.name} != product ${product.name}`)
            if (pkg.version !== product.version) problems.push(`package version ${pkg.version} != product ${product.version}`)
            for (const bin of product.bins) if (!pkg.bin?.[bin]) problems.push(`bin ${bin} missing from package.json`)
            if (problems.length) { console.error("product.json and packages/opencode/package.json disagree:"); for (const p of problems) console.error(" -", p); process.exit(1) }
            console.log("product manifest OK:", product.name, product.version, "bins:", product.bins.join(", "))
          '
