name: Release

# Two independent release actions, deliberately **not** chained (same reasoning as
# the GlassPane repo's own release.yml: "a tag was pushed" is not "we decided to
# publish", and publishing is irreversible):
#
#   1) GitHub Release assets — on a `v*` tag, automatically: per-platform binary
#      archives (zip/tar.gz) built on native runners, plus SHA256SUMS.txt.
#      script/build.ts does the upload when OPENCODE_RELEASE=1; the installers pin
#      the tag, so a user can reproduce the exact bytes.
#   2) npm publish — manual workflow_dispatch, dry by default: the platform
#      packages (one per runner) and then the `glasspane-harness` wrapper
#      (postinstall picks the right platform package). Provenance on; the
#      "publish directly refused" case falls back to npm's staged flow so the
#      owner approves explicitly — same model as the GlassPane repo.
#
# Prerequisites on the npm side (external, one-time, owner): a GitHub Actions
# Trusted Publisher for this repo/workflow/environment `release` for every package
# (`glasspane-harness` + the platform packages), with "publish directly" NOT
# enabled. No NPM_TOKEN is configured here on purpose: an empty token written by
# setup-node would defeat OIDC.
#
# The binaries lane builds the targets `product.json` declares — today `darwin-arm64`
# and `darwin-x64`, one runner each. Linux, Windows, musl and `darwin-x64-baseline` are
# not "declared with no lane": they were dropped from `platformTargets` by the macOS-only
# decision (see product.json `platform.dropped` and `platformTargetsNote`), so there is
# nothing here to add a lane for. Re-declaring a target here without a runner would be the
# silent omission this note claims not to have.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_oidc:
        description: "Verify the npm trusted publisher without publishing (stage, then reject)"
        type: boolean
        required: false
        default: false
      publish_npm:
        description: "Publish the npm packages (requires confirm=true)"
        type: boolean
        required: false
        default: false
      confirm:
        description: "I understand npm publishing is irreversible"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  version-check:
    name: tag matches the product version
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must equal product.json's version
        run: |
          node -e '
            const fs = require("fs")
            const product = JSON.parse(fs.readFileSync("product.json", "utf8"))
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (tag !== product.version) { console.error(`tag ${tag} != product.json version ${product.version} — the release lane refuses to ship mismatched bytes`); process.exit(1) }
            console.log("tag and product version agree:", product.version)
          '

  create-release:
    name: create the GitHub release for this tag
    if: success() && github.event_name == 'push'
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release upload` fails with "release not found" when the release does
      # not exist yet, and nothing else in this lane creates one. That is how the
      # first real run died: the binary built, the smoke test passed, and then
      # the upload had nowhere to put the bytes. Creating it here — and only when
      # absent, so re-running a tag is not an error — makes the lane idempotent.
      - name: Create the release as a draft if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Draft, and only `publish-release` clears that flag after the manifest and every
          # `.asc` have landed. Before this ordering existed the release was public from the
          # moment `create-release` ran, so a `binaries` leg that failed after uploading the
          # other one left a live release carrying one asset, no SHA256SUMS.txt and no
          # signature — and `scripts/install.sh` treated exactly that state as "the product
          # ships unsigned releases", warned, and installed the bytes. A release that cannot
          # be verified is not a released one, so it now stays draft until it can be.
          if gh release view "${GITHUB_REF_NAME}" --repo "$GH_REPO" >/dev/null 2>&1; then
            # Idempotent is not the same as correct. A re-run against a re-pointed tag (a tag that
            # was moved after the release was first created) used to print "leaving it as it is" and
            # keep the OLD `targetCommitish` — measured on v0.7.10, where the release pointed at
            # `62366bf` while the tag had moved to `88e75e4`, so the release's own metadata named
            # bytes nobody shipped. Repair the anchor instead of inheriting it.
            existing="$(gh release view "${GITHUB_REF_NAME}" --repo "$GH_REPO" --json targetCommitish --jq .targetCommitish)"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "release ${GITHUB_REF_NAME} exists but targets ${existing}; re-anchoring to this tag's commit ${GITHUB_SHA}"
              gh release edit "${GITHUB_REF_NAME}" --repo "$GH_REPO" --target "$GITHUB_SHA"
              after="$(gh release view "${GITHUB_REF_NAME}" --repo "$GH_REPO" --json targetCommitish --jq .targetCommitish)"
              if [ "$after" != "$GITHUB_SHA" ]; then
                echo "::error::release ${GITHUB_REF_NAME} still targets $after after the edit — refusing to publish under an anchor that names other bytes"
                exit 1
              fi
            fi
            echo "release ${GITHUB_REF_NAME} already exists — anchor verified against ${GITHUB_SHA}"
            exit 0
          fi
          # `--target` names the commit the release is *of*. Without it GitHub records
          # the default branch, and the branch head moves: v0.6.4's release came out
          # with targetCommitish = "main" while the assets were built from the tag's
          # commit, so the release's own metadata pointed at bytes nobody shipped.
          # An idempotent re-run (the branch above) will not repair an old release that
          # was created without this — it needs `gh release edit --target`.
          gh release create "${GITHUB_REF_NAME}" --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --draft \
            --title "glasspane-harness ${GITHUB_REF_NAME}" --generate-notes
          echo "created draft release ${GITHUB_REF_NAME}"

  binaries:
    name: binary ${{ matrix.target }}
    if: success() && github.event_name == 'push'
    needs: [version-check, create-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-13` was the only x64 label for years and GitHub has retired it:
          # the darwin-x64 job sat queued forever with no runner, so a release
          # could never assemble. `macos-15-intel` is the current x64 image.
          # Both targets are required — product.json's platformTargets lists
          # darwin/arm64 and darwin/x64, and the wrapper's postinstall picks
          # between the two platform packages.
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build this platform and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_RELEASE: "1"
        # The version is read from product.json here rather than threaded in from
        # the previous step's output. That indirection made GitHub reject the
        # whole workflow file ("The template is not valid … A mapping was not
        # expected"), which failed every `binaries` job before the build started.
        # product.json is already the single source of truth — the `version-check`
        # job compares the tag against this same field — so reading it here
        # removes a layer rather than adding a second answer.
        #
        # NB: this comment deliberately spells the expression out in prose. A
        # literal step-output expression anywhere at job level — even inside a
        # comment — is what GitHub was choking on, so it must not appear here
        # verbatim either.
        # `build` lives in packages/opencode, not at the workspace root: the root
        # package.json has no `build` script, so `bun run build` from there fails
        # with "Script not found \"build\"" before a single file is compiled. The
        # install above stays at the root on purpose — it is what materialises the
        # workspace — and only the build needs to be in the package.
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          # product.json is the product root's, so it is `../../product.json` from
          # here. `script/build.ts` finds the same file by walking up from its own
          # location, so both read one truth.
          export OPENCODE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('../../product.json','utf8')).version")"
          bun run build --single

      - name: Record the hash of the bytes this run built
        run: |
          set -euo pipefail
          # Anchored to the build, not to what GitHub later serves. The `checksums` job must
          # download the assets from the release in order to sign them, and before this step that
          # download was the only source of the bytes it vouched for: anything able to replace an
          # asset between this upload and that download got its replacement checksummed, signed
          # and endorsed. This hash leaves the runner through the artifact control plane, which a
          # release-asset write cannot reach.
          cd packages/opencode/dist
          : > "$RUNNER_TEMP/asset-sha256-${{ matrix.target }}.txt"
          found=0
          for f in *.zip *.tar.gz; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" >> "$RUNNER_TEMP/asset-sha256-${{ matrix.target }}.txt"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::this build produced no archive in packages/opencode/dist, so nothing can be anchored"
            exit 1
          fi
          cat "$RUNNER_TEMP/asset-sha256-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-sha256-${{ matrix.target }}
          path: ${{ runner.temp }}/asset-sha256-${{ matrix.target }}.txt
          if-no-files-found: error

  checksums:
    name: SHA256SUMS for the release assets
    if: success() && github.event_name == 'push'
    needs: binaries
    runs-on: ubuntu-latest
    # The signing secrets are environment-scoped, so this job has to declare the
    # same environment the publish jobs use. Without it `GPG_INPUT_KEY` arrives
    # empty and the signing step fails on purpose — which is the correct outcome,
    # but only if the declaration is here.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-sha256-*
          merge-multiple: true
          path: ${{ runner.temp }}/asset-hashes
      - name: Download every release asset and checksum it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the target matrix before descending into the working directory, so this is
          # the repo root's product.json and not a path guessed from a child directory.
          wanted="$(node -e 'const p=require("./product.json");for(const t of p.platformTargets)console.log(`${p.name}-${t.os}-${t.arch}${t.abi?"-"+t.abi:""}`)')"
          # The scratch dir must NOT be a repo-relative `assets/`: this repository already
          # tracks a directory by that name (the product's logo.svg / banner.svg), so
          # `mkdir -p assets && cd assets` was a no-op that landed inside the checkout and
          # `sha256sum ./*` then vouched for two committed repository files that are not
          # release assets at all. The published v0.7.1 manifest showed the result: 4 lines,
          # 2 of them unresolvable, and two orphan `.asc` sidecars uploaded for files the
          # release does not carry — a user following `shasum -a 256 -c SHA256SUMS.txt`
          # failed out of the box.
          work="${RUNNER_TEMP:-/tmp}/release-assets"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          # The tag is named, not defaulted. `gh release download` with no argument resolves
          # "latest", and `create-release` now makes a **draft** — which the releases API does not
          # count as latest — so an untagged download quietly fetches the *previous* release's
          # assets. Measured on the first v0.7.10 run: the build-time anchor did its job and said
          # the served bytes are not the bytes this run compiled, because they were v0.7.8's.
          gh release download "${GITHUB_REF_NAME}" --repo "$GH_REPO" --pattern '*.zip' --pattern '*.tar.gz'
          # A dropped or partial download used to be tolerated (`|| true`) as long as
          # *something* arrived, and SHA256SUMS.txt then vouched authoritatively for only
          # the assets that happened to be present — a release could ship one platform and
          # a manifest that looked complete. Coverage is asserted against product.json's
          # own target matrix, so the manifest cannot be narrower than the product.
          # Note what this step still does not prove: the sums are computed from the bytes
          # GitHub serves, so they certify what is stored, not that the build step put it
          # there. Closing that needs the sums taken from the build's own artifacts.
          missing=""
          for name in $wanted; do
            ls "$name".* >/dev/null 2>&1 || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release asset(s) missing, refusing to write a manifest over an incomplete release:$missing"
            exit 1
          fi
          if [ -z "$(ls -A)" ]; then echo "::error::no release assets found to checksum"; exit 1; fi
          # Set equality, both directions, against the product's own target matrix. The two
          # one-way loops this replaces could not fail: the manifest was generated from `./*`
          # one line earlier, so "every listed file exists" and "every file here is listed" were
          # true by construction. An extra asset sitting in the release (any actor with
          # contents:write can upload one) used to be checksummed, signed and endorsed instead of
          # refused; now it is a red build.
          stems="$(for f in ./*; do b="${f#./}"; printf '%s\n' "$b"; done | sed -E 's#\.(zip|tar\.gz|tar\.xz|dmg|exe)$##' | sort -u)"
          want="$(printf '%s\n' $wanted | sort -u)"
          if [ "$stems" != "$want" ]; then
            echo "::error::the downloaded asset set is not the product's target matrix"
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$stems") || true
            exit 1
          fi
          # Anchor the served bytes to the build that made them. `gh release download` above
          # reads what the release holds *now*; the hashes here were recorded inside the build
          # job, before anything could touch the release. Every asset must have exactly one
          # record, must match it, and every record must be claimed by an asset — otherwise the
          # manifest would be endorsing bytes this pipeline cannot trace to a compiler.
          anchors="${RUNNER_TEMP:-/tmp}/asset-hashes"
          unrecorded=""
          mismatched=""
          for f in ./*; do
            b="${f#./}"
            rec="$(awk -v n="$b" '$2 == n { print $1 }' "$anchors"/*.txt 2>/dev/null | head -1)"
            if [ -z "$rec" ]; then
              unrecorded="$unrecorded $b"
              continue
            fi
            got="$(sha256sum "$b" | awk '{print $1}')"
            if [ "$got" != "$rec" ]; then
              mismatched="$mismatched $b(recorded=$rec served=$got)"
            fi
          done
          orphan=""
          for line in "$anchors"/*.txt; do
            n="$(awk '{print $2}' "$line" | head -1)"
            [ -f "./$n" ] || orphan="$orphan $n"
          done
          if [ -n "$unrecorded" ]; then
            echo "::error::asset(s) served by the release carry no build-time hash:$unrecorded"
            echo "::error::refusing to checksum and sign bytes this run cannot trace to a build"
            exit 1
          fi
          if [ -n "$mismatched" ]; then
            echo "::error::asset bytes do not match the hash the build recorded:$mismatched"
            echo "::error::the release asset was replaced between the build and this download"
            exit 1
          fi
          if [ -n "$orphan" ]; then
            echo "::error::a build recorded a hash for an asset the release does not carry:$orphan"
            exit 1
          fi
          echo "every served asset matches the hash its build job recorded"
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Re-read every file against the manifest that was just written: this catches a file
          # that changed under the checksum step (and a manifest truncated mid-write), which no
          # comparison of the manifest to itself can see.
          sha256sum --strict --check SHA256SUMS.txt

      # Sign every release asset (zip/tar.gz) plus SHA256SUMS.txt with GPG, so the
      # installer fallback and any consumer can verify provenance (not just the
      # checksums' integrity). Same model as the GlassPane repo's release lane.
      #
      # The guard lives in the shell, not in `if:`. GitHub does not expose the
      # `secrets` context to an `if` expression, and a file that uses one does
      # not compile at all — the whole workflow is then rejected and *zero* jobs
      # are dispatched, which is what happened here: a release.yml carrying
      # `if: ${{ secrets.GPG_PRIVATE_KEY != '' }}` produced a failed run on every
      # push with no jobs, and no local check (PyYAML, our own check-workflows)
      # could see it. Secrets go through `env`; the decision goes through bash.
      #
      # It fails loudly rather than skipping. A best-effort skip would let a
      # release ship unsigned with nothing in the log saying so, which is the
      # exact outcome the comment above claims cannot happen.
      - name: Sign release assets with GPG
        env:
          GPG_INPUT_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_INPUT_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is empty. The signing key lives in the" \
              "'release' environment, which this job declares, so an empty value" \
              "means it was never set or was renamed. To set it:" \
              "printf '%s' <armored private key> | gh secret set GPG_PRIVATE_KEY --env release" \
              "(same for the passphrase). Nothing is published until this is fixed."
            exit 1
          fi
          # Must be the SAME scratch dir the manifest was written into. This used to be
          # `cd assets`, which silently pointed at the repo-tracked `assets/` after the
          # checksum step moved to $RUNNER_TEMP — and the release then died on
          # "no matches found for `SHA256SUMS.txt`": the manifest and every signature were
          # uploaded from a directory that did not contain them. A path that two steps
          # disagree about is a bug in the path, not in the file.
          cd "${RUNNER_TEMP:-/tmp}/release-assets"
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_INPUT_KEY" | gpg --batch --yes --import
          # Each sidecar is `$f.asc`, which is exactly what the installer fallback
          # (scripts/install.sh) looks for next to the tarball it downloads.
          for f in ./* SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            # The passphrase goes on a file descriptor, not into argv: while gpg runs, a
            # process's argv is readable on the runner, and this is the production signing key's
            # passphrase. The main repo's lane made exactly this change and recorded the
            # measurement; `gpg --version`-style probing does not show it, so it stays here.
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --armor "$f"
            # `gpg` returning 0 is not the same as the sidecar landing. A release used to go out
            # with no `.asc` files and only an incidental `ls` noticing afterwards.
            [ -s "${f}.asc" ] || { echo "::error::gpg exited 0 but ${f}.asc is missing or empty"; exit 1; }
          done
          ls -la ./*.asc

      # Upload SHA256SUMS.txt plus any `.asc` signatures (present only when the
      # signing secrets are configured; an empty $ASC_FILES expands to nothing, so
      # gh never references a missing file). Re-uploading SHA256SUMS.txt with
      # --clobber is idempotent.
      - name: Upload checksum and signature files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Never `${{ github.ref_name }}` inline: a git ref may contain `$`, backticks, `;`
          # and `&`, and this job runs on any `v*` tag push, so interpolating it into the shell
          # would let a crafted tag name execute inside the signing job. The shape check is the
          # second half — the value arrives through the environment, and only a release tag
          # reaches the command.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::refusing to upload for a ref that is not a release tag: $TAG"; exit 1 ;;
          esac
          # Must be the SAME scratch dir the manifest was written into. This used to be
          # `cd assets`, which silently pointed at the repo-tracked `assets/` after the
          # checksum step moved to $RUNNER_TEMP — and the release then died on
          # "no matches found for `SHA256SUMS.txt`": the manifest and every signature were
          # uploaded from a directory that did not contain them. A path that two steps
          # disagree about is a bug in the path, not in the file.
          cd "${RUNNER_TEMP:-/tmp}/release-assets"
          ASC_FILES=""
          if ls ./*.asc >/dev/null 2>&1; then ASC_FILES="$(ls ./*.asc | tr '\n' ' ')"; fi
          # Say which expectation broke instead of letting gh report "no matches found".
          [ -f SHA256SUMS.txt ] || { echo "::error::SHA256SUMS.txt is not in ${RUNNER_TEMP:-/tmp}/release-assets — the checksum step wrote it somewhere else"; exit 1; }
          gh release upload "$TAG" SHA256SUMS.txt $ASC_FILES --clobber --repo "$GH_REPO"

  publish-release:
    name: Make the release visible once it can be verified
    # The last step of the asset lane, and the only thing that clears `--draft`. A release is
    # public from the moment it exists, and `scripts/install.sh` resolves "latest" through the
    # releases API — so while the manifest and signature jobs were still running, a user could
    # already be pointed at assets with nothing to check them against. Draft until the checksums
    # and every `.asc` have landed closes that window; a run that fails before this job leaves
    # the release invisible instead of leaving it public and unverifiable.
    if: success() && github.event_name == 'push'
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --repo "$GH_REPO" --draft=false
          # Read it back: `gh release edit` exiting 0 is not evidence the flag took effect on a
          # release that another actor may have already changed.
          state="$(gh release view "${GITHUB_REF_NAME}" --repo "$GH_REPO" --json isDraft --jq .isDraft)"
          if [ "$state" != "false" ]; then
            echo "::error::release ${GITHUB_REF_NAME} is still a draft (isDraft=$state) after the publish step"
            exit 1
          fi
          echo "release ${GITHUB_REF_NAME} is live with its manifest and signatures attached"

  publish-gate:
    name: Refuse to publish a tree no tag vouches for
    # The two publish jobs are the only irreversible steps in this repository, and they run on
    # `workflow_dispatch` — whose `actions/checkout` takes whatever ref the dispatch carried.
    # Without `--ref v<X.Y.Z>` that is the split repo's default branch HEAD, so the lane would
    # publish today's `main` under whatever version `product.json` names, and the provenance
    # attestation would record the branch instead of the tag. The main repo added exactly these
    # assertions after that incident (its `SYNCLOG.md` records it); this lane had nothing.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == true && inputs.confirm == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: The dispatched ref must be the tag this version was cut from
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./product.json').version")"
          WANT="v${VERSION}"
          PKG="$(node -p "require('./packages/opencode/package.json').version")"
          [ "$PKG" = "$VERSION" ] || {
            echo "::error::packages/opencode/package.json says ${PKG} but product.json says ${VERSION} — the wrapper would be published under a version no tag names. Run the version bump in both places."
            exit 1; }
          LS="$(git ls-remote --tags origin)"
          PEELED="$(printf '%s\n' "$LS" | awk -v r="refs/tags/${WANT}^{}" '$2==r{print $1; exit}')"
          DIRECT="$(printf '%s\n' "$LS" | awk -v r="refs/tags/${WANT}" '$2==r{print $1; exit}')"
          TAG_SHA="${PEELED:-$DIRECT}"
          [ -n "$TAG_SHA" ] || {
            echo "::error::origin has no tag ${WANT}. A publish with no tag behind it is unreproducible: the installers and docs both point at a tag. Push the tag first, then dispatch with --ref ${WANT}."
            exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$TAG_SHA" = "$HEAD_SHA" ] || {
            echo "::error::this checkout is not the tree ${WANT} points at: HEAD=${HEAD_SHA}, ${WANT}=${TAG_SHA}. Almost certainly the dispatch omitted --ref and checkout landed on the default branch. Re-run: gh workflow run release.yml --repo ${GITHUB_REPOSITORY} --ref ${WANT} -f publish_npm=true -f confirm=true"
            exit 1; }
          [ "$DISPATCH_REF" = "refs/tags/${WANT}" ] || {
            echo "::error::the dispatched ref is ${DISPATCH_REF}, not refs/tags/${WANT}. Same bytes, different provenance: the attestation would name the former. Re-run with --ref ${WANT}."
            exit 1; }
          echo "publish target verified: ${WANT} = ${HEAD_SHA}, dispatched as ${DISPATCH_REF}"

  publish-platform:
    name: npm ${{ matrix.target }}
    # `success() &&` is load-bearing: a `needs:` edge alone does NOT gate the job when its
    # `if:` is an explicit expression — GitHub runs it even when publish-gate failed, and
    # the tag/HEAD agreement this job exists to enforce would then have guarded nothing.
    # publish-wrapper already carries it (see its `if:`); this job was the bypass.
    if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_npm == true && inputs.confirm == true
    needs: publish-gate
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-13` was the only x64 label for years and GitHub has retired it:
          # the darwin-x64 job sat queued forever with no runner, so a release
          # could never assemble. `macos-15-intel` is the current x64 image.
          # Both targets are required — product.json's platformTargets lists
          # darwin/arm64 and darwin/x64, and the wrapper's postinstall picks
          # between the two platform packages.
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Upgrade npm (staged publishing needs >= 11.15)
        # Pinned, with the evidence for the number: the registry metadata for the published
        # 0.7.0 wrapper records `_npmVersion: 12.2.0` and
        # `_npmUser: GitHub Actions <npm-oidc-no-reply@github.com>` — that is the npm that
        # actually produced the provenance-attested publish from this lane. `npm@latest`
        # here would be third-party code pulled without a pin onto the machine holding the
        # OIDC token, minutes before an irreversible publish. Print the version anyway: a
        # drift between the pin and reality must not be readable as a successful publish.
        run: |
          npm install -g npm@12.2.0
          echo "npm in this publish lane: $(npm --version)"

      - name: Build this platform
        # `build` lives in packages/opencode; the workspace-root package.json has
        # no such script, so running it from here fails with
        # `Script not found "build"` before anything is compiled. The binaries
        # job above already carries this; the npm platform job needs the same
        # working-directory, and it needed it just as much.
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          export OPENCODE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('../../product.json','utf8')).version")"
          bun run build --single

      - name: Validate this platform package with the product's own pack checks
        # This lane used to run a bare `npm publish` on the built directory, so the product's
        # own validator — bin present and executable in the tarball, a README so the npm page is
        # not a bare version string, and (since bd690a9) that the dist carries THIS product
        # version rather than a leftover from the previous release — never saw the bytes this
        # job publishes. The wrapper job already runs publish.ts; making the platform packages
        # answer to the same ruler is the difference between "the build worked" and "we checked
        # what is about to become installable". `--dry-run` packs and validates every dist found
        # here and publishes nothing; the not-all-targets line stays a note in dry-run, because
        # one runner builds one target by design.
        working-directory: packages/opencode
        run: bun run script/publish.ts --dry-run

      - name: Publish the platform package with provenance (staged-only fallback)
        shell: bash
        run: |
          set -euo pipefail
          cd packages/opencode
          # product.json is the product root's, so it is `../../product.json` from
          # here — same rule as the build step above. Reading a bare
          # `product.json` from this directory dies with ENOENT, and it dies
          # *after* a full platform build, which is the expensive way to learn it.
          PRODUCT_JSON="../../product.json"
          pkg="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));const t=p.platformTargets.find(t=>`${t.os==="win32"?"windows":t.os}-${t.arch}`===process.argv[1]);console.log(`${p.name}-${process.argv[1]}${t?.abi?"-"+t.abi:""}`)' '${{ matrix.target }}' "$PRODUCT_JSON")"
          ver="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version" "$PRODUCT_JSON")"
          echo "publishing $pkg@$ver"
          cd "dist/$pkg"
          # The fallback used to be an unconditional `||`: E401, E404, a registry 5xx,
          # a tarball problem and the E409 duplicate-version shape that burned 0.5.0 all
          # took the same branch and printed a notice naming a cause that was not true —
          # then, if `npm stage publish` returned 0, the job went green having published
          # nothing. Staging is for one situation only: the registry refusing a *direct*
          # publish because the package is configured for staged/trusted publishing.
          # Anything else is a failure, and it has to stay a failure.
          log="$(mktemp)"
          rc=0
          npm publish --provenance --access public >"$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            if grep -qiE "staged publishing|only allowed through (the )?oidc|trusted publisher|publishing directly is not allowed" "$log"; then
              echo "::notice::the registry refused a direct publish for $pkg@$ver — staging instead"
              npm stage publish . --provenance
              echo "::notice::owner approves with: npm stage approve <stage-id> (ids: npm stage list)"
              echo "STAGED, NOT PUBLISHED: $pkg@$ver is waiting for owner approval."
              # Fail the job. This run has not put the package on the registry, and a green
              # `publish-platform` is what `publish-wrapper` trusts — v0.7.6 shipped exactly that
              # shape: job green, provenance in the transparency log, package absent, and an
              # install that places no binary. The owner's approval is a physical 2FA step, so the
              # honest outcome here is a red run that names the one command to finish.
              echo "::error::$pkg@$ver is staged, not published — approve it and re-dispatch this tag"
              rm -f "$log"
              exit 1
            else
            # Re-dispatching a tag is a supported operation everywhere else in this lane
            # (`create-release` reuses the release, `gh release upload --clobber` replaces assets),
            # but the npm jobs could not do it: a second run of the same version dies with
            # "You cannot publish over the previously published versions", measured on the second
            # dispatch of v0.7.10 — the platform packages were live from the first run and both
            # jobs went red. Tolerating that message blindly would be its own false green (it is
            # the same bytes or it is somebody else's), so the version is checked rather than
            # forgiven: this build's tarball and the registry's copy must have the same sha512.
            if grep -qiE "cannot publish over the previously published versions" "$log"; then
              # A re-dispatch of a tag that already published this version. The first instinct —
              # "prove the registry's copy equals what this build would send" — is not testable and
              # was wrong: measured across two runs of v0.7.10, npm's own integrity for the SAME
              # version differed (sha512-t01wKyYfMFO1U… then sha512-Dm90l7AmByGjE…) because packing
              # stamps per-build metadata into the tar. Byte equality between two builds is not a
              # property this product has, so it must not be a gate — a gate that can only fail is
              # not a control, it is a lock on the recovery path.
              # What IS decidable, and what the v0.7.6 incident actually was: is this version
              # present? So re-ask presence (with the same propagation wait the wrapper lane uses),
              # record both hashes for the audit trail, and let the lane move on. Whether the
              # published bytes are the product's own is answered downstream by the lane that
              # installs them: `verify-published`.
              packed="$(npm pack --json 2>/dev/null || true)"
              mine="$(printf '%s' "$packed" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const e=Array.isArray(j)?j[0]:j;process.stdout.write(e?.integrity ?? "")}catch{process.stdout.write("n/a")}})')"
              rm -f ./*.tgz
              got=""
              for attempt in $(seq 1 24); do
                got="$(npm view "${pkg}@${ver}" dist.integrity --registry https://registry.npmjs.org --prefer-online 2>/dev/null || true)"
                [ -n "$got" ] && break
                sleep 30
              done
              if [ -z "$got" ]; then
                echo "::error::$pkg@$ver was refused as a duplicate, yet the registry has no such version after 12 minutes — that is the v0.7.6 shape (job green, package absent) and it stays red"
                rm -f "$log"
                exit 1
              fi
              echo "already published: ${pkg}@${ver} is live on the registry (registry integrity=$got; this rebuild would have been $mine)."
              echo "npm stamps per-build metadata into the tar, so those two are expected to differ; presence is the assertion, and the bytes are checked by verify-published when someone installs them."
              rm -f "$log"
              exit 0
            fi
            echo "::error::$pkg@$ver failed to publish (exit $rc) and nothing in the output says the registry refused a direct publish — not staging blindly"
            rm -f "$log"
            exit "$rc"
            fi
          fi
          rm -f "$log"

  publish-wrapper:
    name: npm glasspane-harness (wrapper)
    if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_npm == true && inputs.confirm == true
    needs: publish-platform
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Upgrade npm (staged publishing needs >= 11.15)
        # Pinned, with the evidence for the number: the registry metadata for the published
        # 0.7.0 wrapper records `_npmVersion: 12.2.0` and
        # `_npmUser: GitHub Actions <npm-oidc-no-reply@github.com>` — that is the npm that
        # actually produced the provenance-attested publish from this lane. `npm@latest`
        # here would be third-party code pulled without a pin onto the machine holding the
        # OIDC token, minutes before an irreversible publish. Print the version anyway: a
        # drift between the pin and reality must not be readable as a successful publish.
        run: |
          npm install -g npm@12.2.0
          echo "npm in this publish lane: $(npm --version)"

      - name: Every platform package the wrapper names must already be live
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          # The wrapper's optionalDependencies are computed from product.json's target matrix, so
          # the wrapper can be published naming a platform version that this run never put on the
          # registry. Measured on v0.7.6: the publish job printed `+ glasspane-harness-darwin-x64@0.7.6`,
          # its provenance reached the transparency log, the job exited 0 — and the registry had no
          # 0.7.6 for that package at all. On an Intel Mac that is `npm install` succeeds, no
          # command appears. A *staged* platform package looks identical from inside its job (exit
          # 0, "STAGED, NOT PUBLISHED"), so the only honest check is the registry's own answer,
          # asked before the wrapper goes out.
          ver="$(node -p "JSON.parse(require('fs').readFileSync('../../product.json','utf8')).version")"
          reg="$(node -p "JSON.parse(require('fs').readFileSync('../../product.json','utf8')).registry")"
          missing=""
          while read -r pkg; do
            # The registry's own answer is what counts, but it is asked with a bounded wait.
            # Measured on the first 0.7.10 run: `publish-platform` reported success for
            # glasspane-harness-darwin-x64 seconds earlier, and this gate read "nothing" and refused
            # the wrapper — npm's read replicas lag a fresh publish by minutes (this repository has
            # hit 12–20 minutes before). A single instantaneous answer is not "the package is absent";
            # the absence has to survive the propagation window to mean anything. `--prefer-online`
            # skips npm's local cache so at least one layer of staleness is not our own.
            got=""
            for attempt in $(seq 1 24); do
              got="$(npm view "${pkg}@${ver}" version --registry "$reg" --prefer-online 2>/dev/null || true)"
              [ "$got" = "$ver" ] && break
              sleep 30
            done
            if [ "$got" != "$ver" ]; then
              missing="$missing ${pkg}@${ver}(registry answered ${got:-nothing} after 12 minutes of polling)"
            else
              echo "live: ${pkg}@${ver} (after $attempt poll(s))"
            fi
          done < <(node -e 'const p=require("../../product.json");const n=(t)=>[p.name,t.os==="win32"?"windows":t.os,t.arch,t.avx2===false?"baseline":undefined,t.abi].filter(Boolean).join("-");for(const t of p.platformTargets)console.log(n(t))')
          if [ -n "$missing" ]; then
            echo "::error::refusing to publish a wrapper naming packages that are not live:$missing"
            echo "::error::if a platform job printed STAGED, NOT PUBLISHED, the owner must approve it: npm stage list --registry $reg, then npm stage approve <stage-id>"
            exit 1
          fi
          echo "every declared platform package is live at $ver"

      - name: Assemble and publish the wrapper (optionalDependencies come from product.json)
        working-directory: packages/opencode
        shell: bash
        run: |
          set -euo pipefail
          # Same rule as the platform lane, and it matters more here: `publish.ts` exits
          # non-zero for two very different reasons — the tarball failed its shape checks,
          # or the registry refused a direct publish. The old `if !` could not tell them
          # apart and staged the package in both cases, which would publish bytes that
          # this very pipeline just refused. Only the registry refusal may stage.
          log="$(mktemp)"
          rc=0
          bun run script/publish.ts --wrapper-only >"$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            if grep -qiE "staged publishing|only allowed through (the )?oidc|trusted publisher|publishing directly is not allowed" "$log"; then
              echo "::notice::the registry refused a direct publish of the wrapper — staging instead"
              cd dist/glasspane-harness
              npm stage publish . --provenance
              echo "::error::the wrapper is STAGED, NOT PUBLISHED — it is waiting for the owner's 2FA approval"
              echo "STAGED, NOT PUBLISHED: the wrapper is waiting for owner approval."
              echo "::error::run 'npm stage list' and approve it; this job must not end green while nothing is installable"
              exit 1
            else
              echo "::error::the wrapper lane failed (exit $rc) without a registry refusal — nothing was published or staged"
              rm -f "$log"
              exit "$rc"
            fi
          fi
          rm -f "$log"

  # The lane that asks the registry's own question: can a user install what this run published,
  # and does the command they get actually run? `product.json` → `npm.publishPolicy` promised
  # "发布后跑 verify-published" and nothing wired it, so the only check that walks the user's path
  # — download the published tarball, install into a throwaway prefix, run `--version`, confirm
  # the binary serves the embedded web app — was a manual step nobody took on a bad release.
  # It has to run on macOS: the wrapper's `os` field refuses a Linux install by design, and an
  # install that is refused is not the release being tested.
  verify-published:
    name: install the published bytes and run them
    if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_npm == true && inputs.confirm == true
    needs: publish-wrapper
    runs-on: macos-14
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Verify the published version end to end
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bun run script/verify-published.ts "$version"

  # Does the npm trusted publisher actually work? Proved, not assumed.
  #
  # WHY STAGE-THEN-REJECT: a direct publish would need a version that does not exist
  # yet, and "npm whoami" does not reflect OIDC (npm documents this). `npm stage
  # publish` *is* an OIDC-authenticated operation, so staging the wrapper and then
  # rejecting it exercises exactly the path a release takes — repository, workflow
  # filename, environment — and leaves nothing behind. It needs no macOS runner,
  # because it never builds a binary.
  verify-trusted-publisher:
    name: verify npm trusted publisher (OIDC)
    if: github.event_name == 'workflow_dispatch' && inputs.verify_oidc == true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Upgrade npm (staged publishing needs >= 11.15)
        # Pinned, with the evidence for the number: the registry metadata for the published
        # 0.7.0 wrapper records `_npmVersion: 12.2.0` and
        # `_npmUser: GitHub Actions <npm-oidc-no-reply@github.com>` — that is the npm that
        # actually produced the provenance-attested publish from this lane. `npm@latest`
        # here would be third-party code pulled without a pin onto the machine holding the
        # OIDC token, minutes before an irreversible publish. Print the version anyway: a
        # drift between the pin and reality must not be readable as a successful publish.
        run: |
          npm install -g npm@12.2.0
          echo "npm in this publish lane: $(npm --version)"

      - name: Stage the wrapper through OIDC, then reject it
        working-directory: packages/opencode
        shell: bash
        run: |
          set -euo pipefail
          # The wrapper manifest is generated by the publish script, so generate it
          # without publishing anything (--dry-run does exactly that and touches no
          # registry).
          bun run script/publish.ts --dry-run --wrapper-only
          cd dist/glasspane-harness
          # Stage a *probe* version. Staging the real one would be refused as
          # "already published" and we would learn nothing about the OIDC exchange —
          # which is the whole question. A prerelease carrying the run number can
          # never collide and is never published: we reject it in the next step.
          node -e '
            const fs = require("fs")
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"))
            p.version = `${p.version}-oidc-probe.${process.env.GITHUB_RUN_NUMBER}`
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2))
            console.log("probe version:", p.version)
          '
          npm stage publish . --provenance
          # The registry attributes the stage to "GitHub Actions (trusted automation)"
          # when the trusted publisher matched, so this line is the proof.
          echo "::notice::staged through OIDC — the trusted publisher matched (repo, workflow, environment)"
          # Rejecting needs proof of presence, which OIDC deliberately does not carry:
          # npm documents that stage list/view/approve/reject require interactive auth.
          # So the probe cannot clean up after itself, and pretending otherwise would be
          # a lie in a release lane. It prints exactly what a human must run instead.
          id="$(npm stage list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j[0]?.id ?? "")}catch{}})')"
          if [ -n "$id" ]; then
            echo "::notice::a staged probe is waiting for a human reject: npm stage reject $id"
            echo "::notice::(or reject it on npmjs.com — a probe must never be published)"
          else
            echo "::notice::could not read the stage list without interactive auth; check npmjs.com for a staged probe to reject"
          fi
