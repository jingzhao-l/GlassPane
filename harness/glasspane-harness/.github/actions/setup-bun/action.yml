name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: The bun that runs this lane is the pinned bun
      shell: bash
      # Until this step existed, neither branch of "Setup Bun" was checked against the pin. On X64
      # the download URL is built from `packageManager`, but `oven-sh/setup-bun` can fall back to its
      # own default if the fetch fails, and on every other branch it resolves `bun-version-file`
      # itself — either way, the interpreter that then runs `script/publish.ts` and the whole
      # fixed-point suite was never compared with the version this repository declares.
      # The assertion is version equality read from the tree at run time, so it cannot rot; there is
      # deliberately no digest contract file here, because the asset comes from the pinned official
      # release URL above (github.com/oven-sh/bun/releases/download/bun-v<pin>/…) and swapping that
      # asset is outside this repository's trust root. What is inside it is running the wrong version.
      run: |
        set -euo pipefail
        # `|| true` on both reads so the refusal below is this step's message and not a node stack
        # or a "command not found": a manifest without a bun pin, or a runner with no bun on PATH, are
        # both exactly the cases this assertion exists to catch, and both have to say so by name.
        pinned="$(node -p "require('./package.json').packageManager.split('@')[1]" 2>/dev/null || true)"
        if [ -z "$pinned" ] || [ "$pinned" = "undefined" ]; then
          echo "::error::package.json has no readable \`packageManager\` bun pin — there is nothing to compare the runner's bun against; refusing to run an unpinned interpreter"
          exit 1
        fi
        if ! command -v bun >/dev/null 2>&1; then
          echo "::error::no bun on PATH after Setup Bun (package.json pins bun@$pinned) — refusing to install, test or publish without an interpreter to check"
          exit 1
        fi
        actual="$(bun --version 2>/dev/null || true)"
        if [ -z "$actual" ]; then
          echo "::error::\`bun --version\` answered nothing ($(command -v bun)) while package.json pins bun@$pinned — refusing"
          exit 1
        fi
        if [ "$actual" != "$pinned" ]; then
          echo "::error::bun on PATH is $actual ($(command -v bun)) but package.json pins packageManager bun@$pinned — refusing to install, test or publish on an unpinned interpreter"
          exit 1
        fi
        echo "bun $actual == package.json packageManager pin (bun@$pinned)"

    - name: Get cache directory
      id: cache
      shell: bash
      # Written as one statement before: `echo "dir=$(bun pm cache)"` exits 0 even when `bun pm cache`
      # fails, because the substitution's status is not the command's. The step then publishes an empty
      # `dir`, and the restore below points at nothing — which shows up as an ordinary cold run rather
      # than as a broken cache. Ask for the number and refuse when there isn't one.
      run: |
        set -euo pipefail
        dir="$(bun pm cache)"
        [ -n "$dir" ] || { echo "::error::bun pm cache answered an empty directory — refusing to restore a cache keyed on nothing" >&2; exit 1; }
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Check the interpreter the native install scripts need
      # This step used to be `python3 -m pip install setuptools || pip install setuptools || true`,
      # i.e. an unpinned third-party package pulled onto the machine that builds and signs the release,
      # with no lockfile and no hash, behind three `||` arms that made failure indistinguishable from
      # success. It is gone, on evidence rather than preference:
      #
      #   · What invokes node-gyp here is the `install` script of `tree-sitter-bash` /
      #     `tree-sitter-powershell` (both `node-gyp-build`, both in the root package.json's
      #     trustedDependencies). `tree-sitter-bash` ships `prebuilds/darwin-arm64` and
      #     `darwin-x64`, so nothing compiles for it on either release runner;
      #     `tree-sitter-powershell@0.25.10` ships NO `prebuilds/` at all, so node-gyp-build falls
      #     through to a real `node-gyp rebuild` — measured in this checkout, whose
      #     `packages/opencode/node_modules/tree-sitter-powershell/build/` carries the generated
      #     `Makefile` / `config.gypi` with `"python": "/usr/local/bin/python3"` recorded in it.
      #     `@parcel/watcher` and `@lydell/node-pty` resolve to their per-platform prebuilt packages
      #     in bun.lock, so they never reach a compiler.
      #   · What that build needs is a supported python3, NOT setuptools. bun.lock pins
      #     `node-gyp@12.3.0`; node-gyp spawns its vendored `gyp/gyp_main.py` directly
      #     (`lib/configure.js`), and all 58 .py files under that `gyp/` tree contain zero references
      #     to `distutils` or `setuptools`. The only `setuptools` strings in the package are in
      #     `gyp/pyproject.toml`'s `[build-system]` / `[project].dependencies` — which matter when
      #     gyp-next is *installed as a wheel*, a path node-gyp never takes. node-gyp's own README
      #     says it plainly: "Python >= v3.12 requires `node-gyp` >= v10" — the `pip install
      #     setuptools` shim was the pre-v10 fix for the distutils removal, and this lockfile is v12.
      #
      # So the step installed nothing this build reads, and its `|| true` meant a genuinely broken
      # interpreter would surface later as a compiler error somewhere unhelpful. What is left is the
      # requirement the deleted step was nominally about, stated where it can fail: no python3 means
      # node-gyp cannot run at all, so say so here — before `bun install` spends its minutes — rather
      # than letting the native build die on a stack of `|| true`.
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is not on PATH. \`bun install\` in this workspace compiles" \
            "tree-sitter-powershell through node-gyp (that package ships no prebuilds), and node-gyp" \
            "cannot configure without a Python interpreter. Nothing was installed by this action yet," \
            "so nothing needs cleaning up: fix the runner image or the PATH and re-run."
          exit 1
        fi
        python3 -c 'import sys; print("native-build interpreter:", sys.version.split()[0], "->", sys.executable)'

    - name: Install dependencies
      run: |
        set -euo pipefail
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [ "$RUNNER_OS" = "Windows" ]; then
          bun install --linker hoisted ${{ inputs.install-flags }}
        else
          bun install ${{ inputs.install-flags }}
        fi
      shell: bash

    - name: Save Bun dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
