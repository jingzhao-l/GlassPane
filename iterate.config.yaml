# GlassPane 项目级 iterate 配置
# 由 AI 通道 onboarding 生成（GlassPane dogfood 自家 iterate 生态）。
# 改版本请走 scripts/set-version.mjs；本文件的 validation.commands 是运行时唯一
# 可信命令白名单——只能逐字匹配执行，加参数或换目录都会被拒绝。

goal: "在完全不牺牲证据诚实性的前提下收敛代码质量：门禁全绿、跨层契约同步、测不出的仍标未验证"

max_rounds: 7

# 审查/修复产出的语言（本仓文档与提交正文以中文为主）
language: zh

mode: iterate

dimensions:
  - correctness
  - security
  - performance
  - architecture
  - style-tests
  - tech-debt
  - spec-compliance
  - frontend-backend
  - ui-ux

review:
  scope: full

atomic:
  max_lines: 20
  max_adjacent_methods: 3

git:
  target_branch: main
  # 本仓主工作副本常被并行会话以 dirty 状态占用，worktree 隔离是硬要求
  use_worktree: true
  push_per_round: false
  auto_merge: false

# 按范围的审查蓝图：目标指明层次时走对应集合，跨层改动取并集
dimension_sets:
  engine:
    dimensions:
      - correctness
      - performance
      - architecture
      - spec-compliance
      - style-tests
      - tech-debt
    focus:
      correctness: "归因/证据语义不可让步：不得为通过断言而伪造测量或借用他卡读数"
      performance: "注意 latency budget 与快照保留上限（EngineCore 常量）"
  gui:
    dimensions:
      - ui-ux
      - frontend-backend
      - correctness
      - style-tests
    focus:
      ui-ux: "面板只呈现 daemon 实测结果；未验证态必须可见且不被美化"
      frontend-backend: "设置界面读数与 glasspaned --permissions 自报必须同源"
  mcp:
    dimensions:
      - correctness
      - spec-compliance
      - security
      - style-tests
    focus:
      spec-compliance: "工具契约三处镜像：kernel schema / daemon / mcp-shell tools.ts"
      security: "结构化错误里的 remedy 必须可执行，且不得泄露屏幕内容"
  bridge:
    dimensions:
      - correctness
      - security
      - style-tests
      - tech-debt
  release:
    dimensions:
      - correctness
      - security
      - spec-compliance
      - tech-debt
    focus:
      security: "发布通道不可逆：provenance / staged-only / 校验和三者语义不得混淆"
  docs:
    dimensions:
      - spec-compliance
      - correctness
      - tech-debt
    focus:
      correctness: "文档主张须能指到代码位置或已发生的 CI/registry 实测"

validation:
  command_whitelist:
    - "npm"
    - "node"
    - "swift"
    - "python3"
    - "sh"
  # 全部经仓库根实测通过（2026-09-22），且与 .github/workflows/ci.yml 各 lane 对齐
  commands:
    typescript:
      - "npm run build"
      - "npm test --workspaces --if-present"
    release:
      - "node scripts/check-version.mjs"
    swift:
      - "swift build --package-path engine"
      - "swift test --package-path engine"
    swift-probe:
      - "swift test --package-path engine/probe"
    python:
      - "python3 -m pytest -q bridge"
    shell:
      - "sh -n install.sh"

# 交付时必须成立的不变量（/iterate defensive 收尾由 `iterate invariant` 执行）
invariants:
  ensure:
    - "README.md"
    - "README.zh-CN.md"
    - "CHANGELOG.md"
    - "SECURITY.md"
    - "CONTRIBUTING.md"
    - "install.sh"
    - "specs/GlassPane_PRD_v1.0.md"
  commands:
    typescript:
      - "npm run build"
      - "npm test --workspaces --if-present"
    release:
      - "node scripts/check-version.mjs"
    swift:
      - "swift build --package-path engine"
      - "swift test --package-path engine"
    python:
      - "python3 -m pytest -q bridge"

reviewer:
  output_schema_validation: true
  evidence_validation: true
  coverage_validation: true
  scope_chunk_size: 25

personalization:
  # 禁区：验收台账与跨语言契约，iterate 不得单边改写
  protected_paths:
    - "specs/**"
    - "kernel/schemas/**"
    - "LICENSE"
  risk_areas:
    - path: "engine/Sources/GlassPaneEngine/"
      reason: "归因与证据语义核心；改动等于改动产品对外承诺"
    - path: "engine/Sources/glasspaned/main.swift"
      reason: "信号处理与 socket 生命周期（sigwait 方案被真机证伪过替代方案）"
    - path: "mcp-shell/src/tools.ts"
      reason: "对外 MCP 工具契约，需与 kernel schema 和 daemon 三处同步"
    - path: ".github/workflows/release.yml"
      reason: "不可逆发布通道（GitHub Release 资产 + npm provenance/stage）"
    - path: "scripts/version-sites.mjs"
      reason: "版本线位点表；漏一位即用户装到的与仓库不一致"

